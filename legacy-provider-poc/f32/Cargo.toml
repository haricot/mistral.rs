[package]
name = "legacy-provider-f32-poc"
version = "0.1.0"
edition = "2021"
publish = false

# Isolate the mechanism proof from model loading and production kernel builds.
[workspace]

[features]
default = []
cuda = ["candle-core/cuda", "mistralrs-kernel-runtime/cuda"]

[dependencies]
mistralrs-kernel-runtime = { path = "../../mistralrs-kernel-runtime" }
candle-core = { version = "0.11.0", git = "https://github.com/haricot/candle.git", rev = "9cba2e898af3d25a89257f1f2ec5acece0404dcb" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
