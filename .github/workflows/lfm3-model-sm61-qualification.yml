name: LFM3 real-model qualification on physical SM61
on:
  workflow_dispatch:
    inputs:
      legacy_run:
        type: string
        default: '41080696084'
        required: true
      extended_run:
        type: string
        default: '41080753574'
        required: true
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: lfm3-model-sm61
  queue: max
  cancel-in-progress: false
env:
  CI_CUDA_IMAGE: ghcr.io/haricot/mistral-ci-sm61@sha256:1ea7476aee23aed947918bb7159aaf82ae9f4e98caec19db1160768000354eee
jobs:
  prepare:
    name: prepare
    if: github.ref == 'refs/heads/mirror_orch'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
      fingerprint: ${{ steps.prepare.outputs.fingerprint }}
      reuse_models: ${{ steps.prepare.outputs.reuse_models }}
      environment_key: ${{ steps.prepare.outputs.environment_key }}
      cache_key: ${{ steps.prepare.outputs.cache_key }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify original completed campaigns and immutable artifacts
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_RUN: ${{ inputs.legacy_run }}
          EXTENDED_RUN: ${{ inputs.extended_run }}
        run: python3 .github/lfm3/qualification.py prepare --output "$RUNNER_TEMP/qualification" --legacy-run "$LEGACY_RUN" --extended-run "$EXTENDED_RUN"
      - name: Recheck the pinned Candle physical proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/campaign/verify-candle.py "$RUNNER_TEMP/qualification/campaigns/legacy/plan.json"
          python3 .github/campaign/verify-candle.py "$RUNNER_TEMP/qualification/campaigns/extended/plan.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mistral-asd-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification/
          retention-days: 90
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.prepare.outputs.reuse_models == 'true'
        with:
          name: lfm3-model-proof-${{ steps.prepare.outputs.fingerprint }}
          path: ${{ runner.temp }}/qualification/model-proof/
          retention-days: 90
  cpu:
    name: cpu
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -v -s .github/lfm3/tests
      - run: python3 -B -m unittest discover -v -s .github/campaign/tests
  cuda_compile:
    name: cuda_compile
    needs: [prepare, cpu]
    if: needs.prepare.outputs.reuse_models != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - name: Free unused hosted toolchains
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-asd-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: ${{ runner.temp }}/campaign-cache
          key: lfm3-cli-${{ needs.prepare.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lfm3-cli-${{ needs.prepare.outputs.fingerprint }}-
            lfm3-cli-
            mistral-sm61-${{ needs.prepare.outputs.environment_key }}-${{ needs.prepare.outputs.cache_key }}-
            mistral-sm61-${{ needs.prepare.outputs.environment_key }}-
      - name: Compile only the two additional CLI executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$CI_CUDA_IMAGE"
          mkdir -p "$RUNNER_TEMP/campaign-cache" "$RUNNER_TEMP/qualification-home"
          docker run --rm --user "$(id -u):$(id -g)" --security-opt=no-new-privileges --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:rw" -v "$RUNNER_TEMP:$RUNNER_TEMP:rw" -w "$GITHUB_WORKSPACE" \
            -e "HOME=$RUNNER_TEMP/qualification-home" -e "CAMPAIGN_CACHE=$RUNNER_TEMP/campaign-cache" \
            "$CI_CUDA_IMAGE" "$RUNNER_TEMP/qualification/lfm3/build.sh" "$RUNNER_TEMP/qualification"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.cache.outputs.cache-primary-key != ''
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/campaign-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lfm3-model-binaries-${{ needs.prepare.outputs.fingerprint }}
          path: ${{ runner.temp }}/qualification/binaries/
          retention-days: 90
          compression-level: 0
  gpu:
    name: SM61 Mistral Extended runtime (candidate=${{ needs.prepare.outputs.candidate }})
    needs: [prepare, cpu, cuda_compile]
    if: needs.prepare.outputs.reuse_models != 'true'
    runs-on: [mistral-extended, 'mistral-extended-${{ github.run_id }}']
    timeout-minutes: 90
    env:
      ASD_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-asd-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: lfm3-model-binaries-${{ needs.prepare.outputs.fingerprint }}
          path: ${{ runner.temp }}/qualification/binaries
      - name: Recheck physical Candle source qualifications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$RUNNER_TEMP/qualification/campaign/verify-candle.py" "$RUNNER_TEMP/qualification/campaigns/legacy/plan.json"
          python3 "$RUNNER_TEMP/qualification/campaign/verify-candle.py" "$RUNNER_TEMP/qualification/campaigns/extended/plan.json"
      - name: Real Text VL GGUF CPU references and sequential physical CUDA comparisons
        run: python3 "$RUNNER_TEMP/qualification/lfm3/qualification.py" execute --output "$RUNNER_TEMP/qualification"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: lfm3-model-proof-${{ needs.prepare.outputs.fingerprint }}
          path: ${{ runner.temp }}/qualification/model-proof/
          if-no-files-found: warn
          retention-days: 90
