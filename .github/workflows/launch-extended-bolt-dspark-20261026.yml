name: Launch pinned Extended Bolt and DSpark once
on:
  push:
    branches: [mirror_orch]
    paths:
      - .github/workflows/launch-extended-bolt-dspark-20261026.yml
permissions:
  contents: read
  actions: write
concurrency:
  group: launch-extended-bolt-dspark-20261026
  cancel-in-progress: false
jobs:
  dispatch:
    if: >-
      github.repository == 'haricot/mistral.rs' &&
      github.ref == 'refs/heads/mirror_orch' &&
      github.event.head_commit.message == 'ci: launch Extended Bolt and confidence DSpark validation'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SEED: 080fdd5ccf1ff8b6bcb0df9e2dbc189763770588
      EXPECTED_CANDLE: 40b5a8acc43b5f8ef925370ae12daddd929f39f2
      EXPECTED_BOLT: 9bb7f8f158322c0a60ab5b675afacd27146339f7
      EXPECTED_LFM: 892950dccf5e5e74020bfd1d9fd9734e09992d95
      EXPECTED_INTEGRATION: 1753e965031bc705cabe5ce5fb4623d7f6d06d27
      EXPECTED_WORKFLOW_BLOB: c183eef28e6936cddf373178e9e5e39544ce19fd
    steps:
      - name: Verify source pins and dispatch the Extended campaign
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/haricot/mistral.rs/branches/mirror_orch --jq .commit.sha)" = "$GITHUB_SHA"
          test "$(gh api repos/haricot/mistral.rs/branches/asd_runner --jq .commit.sha)" = "$EXPECTED_SEED"
          test "$(gh api repos/haricot/mistral.rs/branches/lfm25_dspark_standalone --jq .commit.sha)" = "$EXPECTED_LFM"
          test "$(gh api repos/haricot/mistral.rs/branches/nemotron_bolt_dflash_standalone --jq .commit.sha)" = "$EXPECTED_BOLT"
          test "$(gh api repos/haricot/candle/branches/extended --jq .commit.sha)" = "$EXPECTED_CANDLE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/mistral-extended-sm61.yml?ref=$GITHUB_SHA" --jq .sha)" = "$EXPECTED_WORKFLOW_BLOB"
          gh api repos/haricot/candle/actions/runs/40029177676 |
            jq -e '.status=="completed" and .conclusion=="success"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mistral-extended-sm61.yml/runs?event=workflow_dispatch&head_sha=$GITHUB_SHA&per_page=100" |
            jq -e '.total_count==0' >/dev/null
          gh workflow run mistral-extended-sm61.yml --repo "$GITHUB_REPOSITORY" --ref mirror_orch \
            -f expected_seed_sha="$EXPECTED_SEED" \
            -f expected_candle_sha="$EXPECTED_CANDLE" \
            -f expected_lfm25_dspark_sha="$EXPECTED_LFM" \
            -f expected_bolt_sha="$EXPECTED_BOLT" \
            -f expected_integration_sha="$EXPECTED_INTEGRATION" \
            -f publish_binary=false
          echo "EXTENDED_DISPATCH=REQUESTED source=$EXPECTED_INTEGRATION" >> "$GITHUB_STEP_SUMMARY"
