name: MEXT G2 — Resolve Pinned Cargo Lock

on:
  push:
    branches:
      - asd_runner_standalone
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mext-g2-cargo-lock
  cancel-in-progress: false

jobs:
  resolve-lock:
    # This workflow never runs on pull_request or untrusted forks.
    if: github.ref == 'refs/heads/asd_runner_standalone'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - name: Resolve exact pinned Candle source and check lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          candle="$(jq -r '.candle_sha' mistral-integration/sources.json)"
          test "$candle" = 66c4651cc83f9a43e79a4aa09302aac9bc763d2c
          test "$(jq -r '.candle_branch' mistral-integration/sources.json)" = extended
          test "$(jq -r '.standalone_status' mistral-integration/sources.json)" = UNVALIDATED_STANDALONE_CANDIDATE
          # Cargo itself recomputes the full git dependency graph.
          cargo +stable metadata --format-version 1 > "$RUNNER_TEMP/metadata.json"
          cargo +stable metadata --locked --format-version 1 > /dev/null
          if git diff --quiet -- Cargo.lock; then
            echo 'Lock already coherent at the pinned Candle SHA' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Do not commit anything except Cargo.lock.
          other="$(git diff --name-only -- . ':!Cargo.lock')"
          test -z "$other" || { echo "::error::Unexpected modified files: $other"; exit 3; }
          changed="$(git diff --numstat -- Cargo.lock)"
          echo "Cargo.lock regenerated by Cargo: $changed" >> "$GITHUB_STEP_SUMMARY"
          test "$(git ls-remote origin refs/heads/asd_runner_standalone | cut -f1)" = "$GITHUB_SHA" || {
            echo "::error::Branch changed during lock resolution; refusing stale push"; exit 3;
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m "build(asd): resolve pinned Candle extended Cargo.lock"
          git push origin HEAD:refs/heads/asd_runner_standalone
          echo 'New lock commit requires fresh standalone CPU/CUDA/physical SM61 validation.' >> "$GITHUB_STEP_SUMMARY"
