name: Legacy V3 residual support CPU
on:
  push:
    branches: [legacy_v3_support]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legacy-v3-support-cpu
  cancel-in-progress: false
  queue: max
jobs:
  composition:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C target-cpu=x86-64
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_OPT_LEVEL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.0
          components: rustfmt
      - name: Test input integrity rejection paths
        run: python3 -m unittest discover -s legacy-v3-support -p test_assemble.py -v
      - name: Compose the exact standalone inputs with residual support
        run: python3 legacy-v3-support/assemble.py --output "$RUNNER_TEMP/legacy-v3-check"
      - name: Compile the integrated CLI with locked dependencies
        working-directory: ${{ runner.temp }}/legacy-v3-check
        run: cargo check --locked -p mistralrs-cli --no-default-features --features code-execution
      - name: Execute the three format CPU regression groups
        working-directory: ${{ runner.temp }}/legacy-v3-check
        run: |
          cargo test --locked -p mistralrs-quant --test bf16_standalone_cpu --test fp8_standalone_cpu --test fp4_standalone_cpu --test nvfp4_checkpoint_tests
          cargo test --locked -p mistralrs-quant --lib nvfp4::
          cargo test --locked -p mistralrs-quant --lib unquantized::
          cargo test --locked -p mistralrs-quant --lib blockwise_fp8::tests
          cargo test --locked -p mistralrs-quant --lib fp8_standalone_geometry
          cargo test --locked -p mistralrs-quant --lib fp8::quantize::tests::test_roundtrip_f8e4m3
      - name: Execute real KV metadata and backend selection contracts
        working-directory: ${{ runner.temp }}/legacy-v3-check
        run: |
          cargo test --locked -p mistralrs-core --lib campaign_cpu_fp8_kv
          cargo test --locked -p mistralrs-core --test legacy_v3_support
          cargo test --locked -p mistralrs-cli --bin mistralrs campaign_cpu_flag_tests
          cargo test --locked -p mistralrs-server-core --lib campaign_runtime_backend_tests
