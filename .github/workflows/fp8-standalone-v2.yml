name: FP8 standalone v2 CPU
on:
  push:
    branches: [fp8_mistralrs_standalone_v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fp8_mistralrs_standalone_v2-cpu
  cancel-in-progress: false
  queue: max
jobs:
  cpu:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: -C target-cpu=x86-64
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_OPT_LEVEL: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify independent master ancestry and reviewed component scope
        run: python3 standalone-fp8-v2/verify_scope.py
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.0
          components: rustfmt
      - name: Check formatting of changed Rust sources
        run: python3 standalone-fp8-v2/verify_scope.py --format
      - name: Compile the current CLI with the exact locked backend
        run: cargo check --locked -p mistralrs-cli --no-default-features --features code-execution
      - name: Run the FP8 CPU regression fixtures
        run: cargo test --locked -p mistralrs-quant --test fp8_standalone_cpu
      - name: Run FP8 CPU quantization and blockwise contracts
        run: |
          cargo test --locked -p mistralrs-quant --lib fp8::quantize::tests::test_roundtrip_f8e4m3
          cargo test --locked -p mistralrs-quant --lib blockwise_fp8::tests
          cargo test --locked -p mistralrs-quant --lib fp8_standalone_geometry
      - name: Test the actual KV capability, layout and hybrid metadata routing on CPU
        run: cargo test --locked -p mistralrs-core --lib campaign_cpu_fp8_kv
