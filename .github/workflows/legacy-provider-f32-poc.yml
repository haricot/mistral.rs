name: Legacy external F32 provider mechanism
on:
  push:
    branches: [legacy-dynamic-providers-poc]
    paths:
      - legacy-provider-poc/f32/**
      - .github/workflows/legacy-provider-f32-poc.yml
      - Cargo.toml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-f32-${{ github.ref }}
  cancel-in-progress: false
env:
  RUSTFLAGS: -C target-cpu=x86-64
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_OPT_LEVEL: '1'
jobs:
  cpu:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.0
          components: rustfmt
      - run: python3 legacy-provider-poc/f32/run.py cpu
  cuda-compile:
    needs: cpu
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cc: ['61', '75', '80']
    container:
      image: ghcr.io/haricot/mistral-ci-sm61@sha256:1ea7476aee23aed947918bb7159aaf82ae9f4e98caec19db1160768000354eee
    env:
      CUDA_COMPUTE_CAP: ${{ matrix.cc }}
      NVCC_CCBIN: g++
      LIBRARY_PATH: /usr/local/cuda/lib64/stubs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 legacy-provider-poc/f32/run.py cuda-compile --output "$RUNNER_TEMP/provider-f32"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-f32-sm${{ matrix.cc }}
          path: |
            ${{ runner.temp }}/provider-f32/packages
            ${{ runner.temp }}/provider-f32/build-evidence.json
          if-no-files-found: error
