name: Legacy V3 pilot campaign
on:
  workflow_dispatch:
    inputs:
      cpu_profile:
        type: choice
        options: [portable, avx2]
        default: portable
        description: Explicit CPU architecture recorded in all proofs
  push:
    branches: [mirror_orch, ci/legacy-v3-campaign]
    paths: ['.github/legacy-v3/**', '.github/workflows/mistral-legacy-v3.yml']
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: mistral-legacy-v3-pilot
  cancel-in-progress: false
  queue: max
jobs:
  contracts:
    name: Legacy V3 campaign contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.0
      - name: Install the pinned archive regression tools
        run: python3 .github/campaign/install-tools.py .github/campaign/config.json "$RUNNER_TEMP/protocol-tools"
      - run: python3 -B -m unittest discover -v -s .github/legacy-v3/tests
        env:
          LEGACY_V3_NEXTEST: ${{ runner.temp }}/protocol-tools/cargo-nextest
      - run: bash -n .github/legacy-v3/build.sh
  cuda_image:
    needs: contracts
    uses: ./.github/workflows/mistral-cuda-ci-image.yml
    permissions:
      contents: read
      packages: write
  prepare:
    name: Prepare Legacy V3 locked candidate
    needs: [contracts, cuda_image]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.plan.outputs.candidate }}
      key: ${{ steps.plan.outputs.key }}
      rustflags: ${{ steps.plan.outputs.rustflags }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.0
          components: rustfmt
      - id: plan
        name: Lock exact sources, deterministic candidate and compiler identity
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_IMAGE: ${{ needs.cuda_image.outputs.image }}
          SDK_KEY: ${{ needs.cuda_image.outputs.environment_key }}
          CPU_PROFILE: ${{ inputs.cpu_profile || 'portable' }}
        run: |
          python3 .github/legacy-v3/campaign.py prepare --repo "$PWD" --directory "$RUNNER_TEMP/legacy-v3" --image "$SDK_IMAGE" --environment-key "$SDK_KEY" --cpu-profile "$CPU_PROFILE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legacy-v3-prep-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/legacy-v3/plan.json
            ${{ runner.temp }}/legacy-v3/candidate.bundle
            ${{ runner.temp }}/legacy-v3/orchestrator/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
  cpu:
    name: Legacy V3 CPU baseline
    outputs:
      artifact_id: ${{ steps.reuse_cpu.outputs.reused == 'true' && steps.reuse_cpu.outputs.artifact_id || steps.upload_cpu.outputs.artifact-id }}
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: ${{ needs.prepare.outputs.rustflags }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: legacy-v3-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legacy-v3
      - id: reuse_cpu
        name: Resolve the exact original CPU-only baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/legacy-v3/campaign.py restore-cpu --directory "$RUNNER_TEMP/legacy-v3" --output "$RUNNER_TEMP/cpu-baseline"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        if: steps.reuse_cpu.outputs.reused != 'true'
        with:
          toolchain: 1.99.0
      - name: Check the exact composed CLI without CUDA
        if: steps.reuse_cpu.outputs.reused != 'true'
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/legacy-v3/orchestrator/.github/legacy-v3/campaign.py" verify-plan --directory "$RUNNER_TEMP/legacy-v3"
          git fetch --no-tags "$RUNNER_TEMP/legacy-v3/candidate.bundle" "refs/heads/integration/legacy-v3/${{ needs.prepare.outputs.key }}"
          git switch --detach --force "$CANDIDATE"
          mkdir -p "$RUNNER_TEMP/cpu-baseline"
          cargo check --locked -p mistralrs-cli --no-default-features --features code-execution 2>&1 | tee "$RUNNER_TEMP/cpu-baseline/check.log"
          cp Cargo.lock "$RUNNER_TEMP/cpu-baseline/Cargo.lock"
          python3 "$RUNNER_TEMP/legacy-v3/orchestrator/.github/legacy-v3/campaign.py" cpu-proof --directory "$RUNNER_TEMP/legacy-v3" --output "$RUNNER_TEMP/cpu-baseline"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: upload_cpu
        if: success() && steps.reuse_cpu.outputs.reused != 'true'
        with:
          name: legacy-v3-cpu-${{ needs.prepare.outputs.key }}
          path: ${{ runner.temp }}/cpu-baseline/
          if-no-files-found: error
          retention-days: 90
  cuda_compile:
    name: Hosted Legacy V3 CUDA and CPU
    if: github.ref == 'refs/heads/mirror_orch' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[legacy-v3-full]'))
    needs: [prepare, cpu, cuda_image]
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    outputs:
      artifact_id: ${{ steps.reuse.outputs.reused == 'true' && steps.reuse.outputs.artifact_id || steps.upload.outputs.artifact-id }}
    steps:
      - name: Free hosted disk for the compiler and archives
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: legacy-v3-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legacy-v3
      - id: reuse
        name: Resolve a complete matching build from its original successful producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/legacy-v3/campaign.py restore-build --directory "$RUNNER_TEMP/legacy-v3" --output "$RUNNER_TEMP/legacy-v3-build"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.reuse.outputs.reused != 'true'
        id: cache
        with:
          path: ${{ runner.temp }}/campaign-cache
          key: legacy-v3-${{ needs.cuda_image.outputs.environment_key }}-${{ needs.prepare.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            legacy-v3-${{ needs.cuda_image.outputs.environment_key }}-${{ needs.prepare.outputs.key }}-
            legacy-v3-${{ needs.cuda_image.outputs.environment_key }}-
            mistral-sm61-${{ needs.cuda_image.outputs.environment_key }}-
      - name: Build the release binary and test archive once, then execute CPU contracts
        if: steps.reuse.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_IMAGE: ${{ needs.cuda_image.outputs.image }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$SDK_IMAGE"
          mkdir -p "$RUNNER_TEMP/campaign-cache" "$RUNNER_TEMP/campaign-home" "$RUNNER_TEMP/legacy-v3-build"
          docker run --rm --user "$(id -u):$(id -g)" --security-opt=no-new-privileges --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:rw" -v "$RUNNER_TEMP:$RUNNER_TEMP:rw" -w "$GITHUB_WORKSPACE" \
            -e "HOME=$RUNNER_TEMP/campaign-home" -e "CAMPAIGN_CACHE=$RUNNER_TEMP/campaign-cache" \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_REF_NAME -e GITHUB_SHA \
            "$SDK_IMAGE" "$RUNNER_TEMP/legacy-v3/orchestrator/.github/legacy-v3/build.sh" "$RUNNER_TEMP/legacy-v3" "$RUNNER_TEMP/legacy-v3-build"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.reuse.outputs.reused != 'true' && steps.cache.outputs.cache-primary-key != ''
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/campaign-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: legacy-v3-build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legacy-v3-build/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: upload
        if: success() && steps.reuse.outputs.reused != 'true'
        with:
          name: legacy-v3-build-${{ needs.prepare.outputs.key }}
          path: ${{ runner.temp }}/legacy-v3-build/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
  resolve:
    name: Resolve Legacy V3 physical evidence
    needs: [prepare, cpu, cuda_compile]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      reused: ${{ steps.evidence.outputs.reused }}
      artifact_id: ${{ steps.evidence.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: legacy-v3-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legacy-v3
      - name: Verify the build selected by the hosted gate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.cuda_compile.outputs.artifact_id }}
        run: python3 .github/legacy-v3/campaign.py restore-build --directory "$RUNNER_TEMP/legacy-v3" --artifact-id "$ARTIFACT" --output "$RUNNER_TEMP/build"
      - id: evidence
        name: Reuse only complete physical and model evidence for identical bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/legacy-v3/campaign.py restore-evidence --directory "$RUNNER_TEMP/legacy-v3" --builds "$RUNNER_TEMP/build" --output "$RUNNER_TEMP/evidence"
  gpu:
    name: Legacy V3 SM61 (candidate=${{ needs.prepare.outputs.candidate }})
    needs: [prepare, cpu, cuda_compile, resolve]
    if: needs.resolve.outputs.reused != 'true'
    runs-on: [mistral-legacy, 'mistral-legacy-${{ github.run_id }}']
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: legacy-v3-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legacy-v3
      - name: Verify the archived executables and their original producer
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.cuda_compile.outputs.artifact_id }}
        run: python3 .github/legacy-v3/campaign.py restore-build --directory "$RUNNER_TEMP/legacy-v3" --artifact-id "$ARTIFACT" --output "$RUNNER_TEMP/build"
      - name: Execute format contracts and all three real models on physical SM61
        run: python3 "$RUNNER_TEMP/legacy-v3/orchestrator/.github/legacy-v3/gpu.py" --preparation "$RUNNER_TEMP/legacy-v3" --builds "$RUNNER_TEMP/build" --output "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: upload
        if: always()
        with:
          name: legacy-v3-evidence-${{ needs.prepare.outputs.key }}
          path: |
            ${{ runner.temp }}/evidence/
            !${{ runner.temp }}/evidence/target/**
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
  finish:
    name: Publish qualified Legacy V3 pilot receipt
    needs: [prepare, cpu, cuda_compile, resolve, gpu]
    if: ${{ !cancelled() && github.ref == 'refs/heads/mirror_orch' && needs.prepare.result == 'success' && needs.cpu.result == 'success' && needs.cuda_compile.result == 'success' && needs.resolve.result == 'success' && (needs.gpu.result == 'success' || (needs.gpu.result == 'skipped' && needs.resolve.outputs.reused == 'true')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: legacy-v3-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legacy-v3
      - name: Verify original build and physical proofs before the leased publication
        env:
          GH_TOKEN: ${{ github.token }}
          CPU_ARTIFACT: ${{ needs.cpu.outputs.artifact_id }}
          BUILD_ARTIFACT: ${{ needs.cuda_compile.outputs.artifact_id }}
          GPU_ARTIFACT: ${{ needs.resolve.outputs.reused == 'true' && needs.resolve.outputs.artifact_id || needs.gpu.outputs.artifact_id }}
        run: |
          python3 .github/legacy-v3/campaign.py restore-cpu --directory "$RUNNER_TEMP/legacy-v3" --artifact-id "$CPU_ARTIFACT" --output "$RUNNER_TEMP/cpu-baseline"
          python3 .github/legacy-v3/campaign.py restore-build --directory "$RUNNER_TEMP/legacy-v3" --artifact-id "$BUILD_ARTIFACT" --output "$RUNNER_TEMP/build"
          python3 .github/legacy-v3/campaign.py restore-evidence --directory "$RUNNER_TEMP/legacy-v3" --builds "$RUNNER_TEMP/build" --artifact-id "$GPU_ARTIFACT" --output "$RUNNER_TEMP/evidence"
          python3 .github/legacy-v3/campaign.py promote --directory "$RUNNER_TEMP/legacy-v3" --repo "$PWD" --builds "$RUNNER_TEMP/build" --evidence "$RUNNER_TEMP/evidence" --cpu-baseline "$RUNNER_TEMP/cpu-baseline" --output "$RUNNER_TEMP/legacy-v3/receipt.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legacy-v3-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legacy-v3/receipt.json
          retention-days: 90
