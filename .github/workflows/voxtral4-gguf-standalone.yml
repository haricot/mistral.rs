name: Voxtral4 GGUF Standalone CPU Contract

on:
  push:
    branches: [voxtral4_gguf]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voxtral4-gguf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Voxtral4 GGUF inventory and formatting (CPU only)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Test complete Voxtral4b header contract (synthetic CPU fixtures)
        run: python3 -B -m unittest discover -s tools -p 'test_voxtral4_gguf_contract.py' -v
      - name: Test embedded Tekken GGUF asset decoder (CPU fixtures)
        run: python3 -B -m unittest discover -s tools -p 'test_voxtral4_gguf_assets.py' -v
      - name: Test Tekken active/inert token-ID domain (CPU fixtures)
        run: python3 -B -m unittest discover -s tools -p 'test_voxtral4_gguf_token_ids.py' -v
      - name: Compile pinned CrispASR C++ tokenizer oracle (model-free)
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/CrispStrobe/CrispASR/369029c91d90a61d8346b8bbdafe426bfdde76d1/src/voxtral_tekken_vocab.h" \
            -o "$tmp/voxtral_tekken_vocab.h"
          [[ "$(git hash-object "$tmp/voxtral_tekken_vocab.h")" == \
            "66a3a97a74adf94b2b177e41552cd0130e90fd58" ]] || {
              echo "::error::Pinned CrispASR tokenizer reference hash mismatch"
              exit 2
            }
          g++ -std=c++17 -O2 -Wall -Wextra \
            -I "$tmp" tools/voxtral4_gguf_cpp_oracle.cpp \
            -o "$tmp/voxtral4_cpp_oracle"
          test -x "$tmp/voxtral4_cpp_oracle"
      - name: Test native Voxtral4 GGUF inventory
        run: cargo +stable test --locked -p mistralrs-core --lib gguf::voxtral4
      - name: Test Rust GGUF Tekken BPE and CrispASR splitting
        run: cargo +stable test --locked -p mistralrs-core --lib gguf::voxtral4_tokenizer
      - name: Test native Voxtral GGUF metadata/params compatibility (B3-A)
        run: cargo +stable test --locked -p mistralrs-core --lib gguf::voxtral4_config
