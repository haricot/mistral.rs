name: Retire superseded invalid Extended preparation 40969865016
on:
  push:
    branches: [mirror_orch]
    paths: [.github/workflows/retire-invalid-extended-40969865016.yml]
permissions:
  contents: read
jobs:
  retire:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel only the unassigned obsolete preparation blocking its replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", "repos/haricot/mistral.rs"+path], text=True))
          run=api("/actions/runs/40969865016")
          assert run["head_sha"]=="1d2b3f307abf6fad1308227c6710c2905c2b4202"
          assert run["run_attempt"]==1 and run["head_branch"]=="mirror_orch"
          assert run["path"]==".github/workflows/mistral-extended-sm61.yml"
          if run["status"]=="completed":
              print("RETIRE_INVALID_EXTENDED=ALREADY_COMPLETED")
          else:
              jobs=api("/actions/runs/40969865016/jobs?per_page=100")["jobs"]
              gpu=[j for j in jobs if j["id"]==123814546278]
              assert len(gpu)==1 and gpu[0]["status"]=="queued" and gpu[0]["conclusion"] is None
              assert not gpu[0].get("runner_id") and not gpu[0].get("runner_name"), "local runner already assigned"
              assert all(j["status"]=="completed" for j in jobs if j["id"]!=123814546278)
              replacement=api("/actions/runs/41080753574")
              assert replacement["head_sha"]=="7c1586c56f149dea5241859fabd66ba053d3b136"
              assert replacement["path"]==run["path"] and replacement["run_attempt"]==1
              subprocess.run(["gh","api","--method","POST","repos/haricot/mistral.rs/actions/runs/40969865016/cancel"],check=True)
              print("RETIRE_INVALID_EXTENDED=CANCEL_REQUESTED replacement=41080753574")
          PY
