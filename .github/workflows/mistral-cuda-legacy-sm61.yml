name: Mistral CUDA Legacy (rebase PR then validate SM61)

# Orchestrated from mirror_orch; source comes from upstream master, not asd_runner.
# Only all-green CPU, hosted CUDA and physical Pascal proofs can replace the PR head.
on:
  workflow_dispatch:
    inputs:
      expected_pr_sha:
        description: Optional pinned SHA of haricot/mistral.rs allow_old_card
        required: false
        default: ""
        type: string
      expected_upstream_sha:
        description: Optional pinned SHA of EricLBuehler/mistral.rs master
        required: false
        default: ""
        type: string
      expected_candle_sha:
        description: Optional pinned SHA of haricot/candle cuda_legacy
        required: false
        default: ""
        type: string

permissions:
  contents: read
concurrency:
  group: mistral-rebase-allow-old-card
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/mirror_orch'
    name: Rebase historical PR and stage immutable candidate
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.stage.outputs.candidate }}
      candidate_ref: ${{ steps.stage.outputs.candidate_ref }}
      pr_sha: ${{ steps.stage.outputs.pr_sha }}
      upstream_sha: ${{ steps.stage.outputs.upstream_sha }}
      candle_sha: ${{ steps.stage.outputs.candle_sha }}
      lock_sha256: ${{ steps.stage.outputs.lock_sha256 }}
    steps:
      - name: Checkout orchestration source and full Git history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: mirror_orch
          fetch-depth: 0
          persist-credentials: true
      - name: Rebase onto official upstream master and pin Candle cuda_legacy
        id: stage
        shell: bash
        env:
          EXPECTED_PR: ${{ inputs.expected_pr_sha }}
          EXPECTED_UPSTREAM: ${{ inputs.expected_upstream_sha }}
          EXPECTED_CANDLE: ${{ inputs.expected_candle_sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/legacy-cuda-rebase.sh
      - name: Archive preparation / conflicts / Cargo.lock
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mistral-legacy-prep-${{ github.run_id }}
          path: ${{ runner.temp }}/legacy-rebase/
          if-no-files-found: warn
          retention-days: 90

  cpu:
    needs: prepare
    name: CPU / fmt / locked dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - name: Validate CPU and candidate identity
        shell: bash
        env:
          SHA: ${{ needs.prepare.outputs.candidate }}
          LOCK: ${{ needs.prepare.outputs.lock_sha256 }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/mistral-legacy-cpu"
          mkdir -p "$report"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$LOCK"
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all -- --check > "$report/fmt.log" 2>&1 || {
            tail -n 90 "$report/fmt.log"; exit 1;
          }
          cargo +stable check --locked -p mistralrs-core -p mistralrs-quant \
            -p mistralrs-paged-attn > "$report/check.log" 2>&1 || {
              tail -n 100 "$report/check.log"; exit 1;
            }
          jq -n --arg sha "$SHA" --arg lock "$LOCK" \
            '{schema_version:1,candidate_sha:$sha,lock_sha256:$lock,
              status:"CPU_PASSED"}' > "$report/report.json"
      - name: Archive CPU proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mistral-legacy-cpu-${{ github.run_id }}
          path: ${{ runner.temp }}/mistral-legacy-cpu/
          if-no-files-found: warn
          retention-days: 90

  cuda_compile:
    needs: [prepare, cpu]
    name: Hosted SM61 CUDA 12.9.2 compile (no GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - name: Compile complete CUDA feature set and smoke test (no execution)
        shell: bash
        env:
          SHA: ${{ needs.prepare.outputs.candidate }}
          LOCK: ${{ needs.prepare.outputs.lock_sha256 }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/mistral-legacy-cuda"
          mkdir -p "$report"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$LOCK"
          docker run --rm --security-opt=no-new-privileges \
            -v "$GITHUB_WORKSPACE:/workspace:rw" \
            -v "$report:/report:rw" -w /workspace \
            -e CUDA_COMPUTE_CAP=61 -e CUDA_HOME=/usr/local/cuda \
            -e CARGO_BUILD_JOBS=2 -e CARGO_INCREMENTAL=0 \
            nvidia/cuda:12.9.2-devel-ubuntu24.04 bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends ca-certificates curl git \
                build-essential libssl-dev protobuf-compiler pkg-config cmake
              curl --proto "=https" --tlsv1.2 -fsSL https://sh.rustup.rs |
                sh -s -- -y --profile minimal --default-toolchain stable
              . "$HOME/.cargo/env"
              nvcc --version
              cargo +stable check --locked -p mistralrs-cli --no-default-features \
                --features cuda-legacy-bf16,cuda-legacy-fp8,cuda-legacy-fp4
              cargo +stable test --locked -p mistralrs-core --no-default-features \
                --features cuda-legacy-bf16,cuda-legacy-fp8,cuda-legacy-fp4 \
                --test legacy_sm61_runtime --no-run
            ' 2>&1 | tee "$report/compile.log"
          jq -n --arg sha "$SHA" --arg lock "$LOCK" \
            '{schema_version:1,candidate_sha:$sha,lock_sha256:$lock,
              target:"sm_61",cuda:"12.9.2",gpu_executed:false,
              status:"CUDA_COMPILE_PASSED"}' > "$report/report.json"
      - name: Archive hosted CUDA proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mistral-legacy-cuda-${{ github.run_id }}
          path: ${{ runner.temp }}/mistral-legacy-cuda/
          if-no-files-found: warn
          retention-days: 90

  gpu:
    needs: [prepare, cpu, cuda_compile]
    name: Physical NVIDIA Pascal SM61 smoke proof
    runs-on: [self-hosted, linux, x64, cuda, sm61]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - name: Validate BF16 / FP8 and F32 operations on actual GPU
        shell: bash
        env:
          SHA: ${{ needs.prepare.outputs.candidate }}
          LOCK: ${{ needs.prepare.outputs.lock_sha256 }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/mistral-legacy-gpu"
          mkdir -p "$report"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$LOCK"
          nvidia-smi --query-gpu=name,compute_cap --format=csv,noheader > "$report/gpu.txt"
          grep -Eq ',[[:space:]]*6\.1([[:space:]]|$)' "$report/gpu.txt"
          if test -x /opt/cuda129/bin/nvcc; then
            export CUDA_HOME=/opt/cuda129 CUDA_PATH=/opt/cuda129
            export PATH="/opt/cuda129/bin:$PATH"
          fi
          export CUDA_COMPUTE_CAP=61 NVCC_CCBIN=/usr/bin/g++-14
          rustup toolchain install stable --profile minimal
          nvcc --version > "$report/nvcc.txt"
          cargo +stable test --locked -p mistralrs-core --no-default-features \
            --features cuda-legacy-bf16,cuda-legacy-fp8,cuda-legacy-fp4 \
            --test legacy_sm61_runtime -- --nocapture > "$report/smoke.log" 2>&1 || {
              tail -n 120 "$report/smoke.log"; exit 1;
            }
          jq -n --arg sha "$SHA" --arg lock "$LOCK" \
            '{schema_version:1,candidate_sha:$sha,lock_sha256:$lock,
              target:"sm_61",gpu_executed:true,tests:["f32","bf16","fp8-e4m3"],
              status:"GPU_PASSED"}' > "$report/report.json"
      - name: Archive physical GPU proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mistral-legacy-gpu-${{ github.run_id }}
          path: ${{ runner.temp }}/mistral-legacy-gpu/
          if-no-files-found: warn
          retention-days: 90

  promote:
    needs: [prepare, cpu, cuda_compile, gpu]
    name: Lease-promote only after all physical proofs pass
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: mistral-legacy-*-${{ github.run_id }}
          path: ${{ runner.temp }}/legacy-proof
          merge-multiple: false
      - name: Check exact proofs, source freshness, protected PR head
        shell: bash
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          REF: ${{ needs.prepare.outputs.candidate_ref }}
          ORIGINAL: ${{ needs.prepare.outputs.pr_sha }}
          MASTER: ${{ needs.prepare.outputs.upstream_sha }}
          CANDLE: ${{ needs.prepare.outputs.candle_sha }}
          LOCK: ${{ needs.prepare.outputs.lock_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$LOCK"
          for gate in cpu cuda gpu; do
            file="$RUNNER_TEMP/legacy-proof/mistral-legacy-$gate-$GITHUB_RUN_ID/report.json"
            test -s "$file"
            jq -e --arg sha "$CANDIDATE" --arg lock "$LOCK" --arg gate "$gate" '
              .candidate_sha==$sha and .lock_sha256==$lock and
              (( $gate=="cpu" and .status=="CPU_PASSED" ) or
               ( $gate=="cuda" and .status=="CUDA_COMPILE_PASSED" and .gpu_executed==false ) or
               ( $gate=="gpu" and .status=="GPU_PASSED" and .gpu_executed==true and
                 .target=="sm_61" and
                 ((.tests|sort)==(["f32","bf16","fp8-e4m3"]|sort))))' "$file" >/dev/null
          done
          prep="$RUNNER_TEMP/legacy-proof/mistral-legacy-prep-$GITHUB_RUN_ID/provenance.json"
          test -s "$prep"
          jq -e --arg sha "$CANDIDATE" --arg old "$ORIGINAL" \
            --arg master "$MASTER" --arg candle "$CANDLE" --arg lock "$LOCK" \
            --arg ref "$REF" '
              .candidate_sha==$sha and .original_pr_sha==$old and
              .upstream_master_sha==$master and .candle_sha==$candle and
              .candle_branch=="cuda_legacy" and .lock_sha256==$lock and
              .candidate_ref==$ref and .status=="CANDIDATE_STAGED"' "$prep" >/dev/null
          git remote add upstream https://github.com/EricLBuehler/mistral.rs.git
          git fetch --no-tags upstream +refs/heads/master:refs/remotes/upstream/master
          git merge-base --is-ancestor "$MASTER" HEAD
          test "$(git ls-remote upstream refs/heads/master | cut -f1)" = "$MASTER" || {
            echo "::error::Upstream moved; prepare a fresh rebase"; exit 3;
          }
          test "$(git ls-remote origin "refs/heads/$REF" | cut -f1)" = "$CANDIDATE"
          test "$(git ls-remote origin refs/heads/allow_old_card | cut -f1)" = "$ORIGINAL" || {
            echo "::error::PR head moved. Refusing to overwrite changes"; exit 3;
          }
          git push --force-with-lease="refs/heads/allow_old_card:$ORIGINAL" \
            origin "$CANDIDATE:refs/heads/allow_old_card"
          echo "Promoted $CANDIDATE to allow_old_card after physical SM61 gate" >> "$GITHUB_STEP_SUMMARY"
