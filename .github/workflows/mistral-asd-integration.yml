name: Mistral ASD Integration
on:
  workflow_dispatch:
    inputs:
      expected_seed_sha:
        description: Immutable 40-character commit SHA of the existing asd_runner branch
        required: true
        type: string
      publish_binary:
        description: Build and publish a downloadable Linux x86_64 SM61 binary after promotion
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: mistral-asd-integration
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/mirror_orch'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      seed: ${{ steps.pin.outputs.seed }}
      candidate: ${{ steps.pin.outputs.candidate }}
      candidate_ref: ${{ steps.pin.outputs.candidate_ref }}
      lock: ${{ steps.pin.outputs.lock }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # Node24
        with:
          ref: asd_runner
          fetch-depth: 0
          persist-credentials: true
      - name: Resolve immutable source set and Cargo.lock
        id: pin
        shell: bash
        env:
          EXPECTED_SEED: ${{ inputs.expected_seed_sha }}
        run: |
          set -euo pipefail
          seed="$(git rev-parse HEAD)"
          [[ "${EXPECTED_SEED}" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Expected exactly one full seed SHA'; exit 2; }
          if [[ "${EXPECTED_SEED}" != "${seed}" ]]; then
            echo "::error::The requested asd_runner ref has moved"; exit 3
          fi
          remote_seed="$(git ls-remote origin refs/heads/asd_runner | cut -f1)"
          [[ "$remote_seed" == "$seed" ]] || { echo '::error::Source moved during checkout'; exit 3; }
          jq -e --arg candle "89adbfa5b8af544f65ad33c7d2facf389e58704e" \
            --arg candle_branch "candle_asd_cuda" \
            --arg base "20f607a77abd4738aa5594ee93a393a9fd284605" \
            --arg sm61 "d3813494903e5cfca01e12df596f3fe14a5d22ba" \
            '.schema_version==1 and
             .candle_repository=="haricot/candle" and
             .candle_branch==$candle_branch and
             .candle_sha==$candle and
             .base_master_sha==$base and
             .sm61_source_sha==$sm61 and
             (.features | sort) == (["cuda-legacy-bf16","cuda-legacy-fp8","cuda-legacy-fp4"] | sort)' \
            mistral-integration/sources.json >/dev/null
          git merge-base --is-ancestor "20f607a77abd4738aa5594ee93a393a9fd284605" HEAD
          git merge-base --is-ancestor "d3813494903e5cfca01e12df596f3fe14a5d22ba" HEAD
          for crate in candle-core candle-nn candle-flash-attn-v3 candle-metal-kernels; do
            grep -E "^${crate} = " Cargo.toml | \
              grep -Fq 'rev = "89adbfa5b8af544f65ad33c7d2facf389e58704e"' || exit 3
          done
          rustup toolchain install stable --profile minimal --component rustfmt
          report="$RUNNER_TEMP/mistral-asd-preflight"
          mkdir -p "$report"
          if ! cargo +stable fmt --all -- --check > "$report/fmt.log" 2>&1; then
            echo "::error::Rustfmt preflight failed on the exact asd_runner seed"
            cat "$report/fmt.log"
            exit 1
          fi
          cargo +stable update --workspace
          cargo +stable metadata --locked --format-version 1 > "$RUNNER_TEMP/asd-metadata.json"
          ! grep -Fq '267c4d8fa8f0f1d2e01c0365875eaedd98414c1e' Cargo.lock
          grep -Fq '89adbfa5b8af544f65ad33c7d2facf389e58704e' Cargo.lock
          lock="$(sha256sum Cargo.lock | cut -d' ' -f1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'build(asd): resolve exact pinned Candle v2 lockfile'
          fi
          candidate="$(git rev-parse HEAD)"
          ref="integration/asd_runner-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${ref}"
          echo "seed=${seed}" >> "$GITHUB_OUTPUT"
          echo "candidate=${candidate}" >> "$GITHUB_OUTPUT"
          echo "candidate_ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "lock=${lock}" >> "$GITHUB_OUTPUT"
          printf 'Candidate %s, lock %s, Candle %s\n' \
            "$candidate" "$lock" "89adbfa5b8af544f65ad33c7d2facf389e58704e" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve preflight diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # Node24
        with:
          name: mistral-asd-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/mistral-asd-preflight/
          if-no-files-found: ignore
          retention-days: 21

  cpu:
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - name: Check CPU, formatting and exact lock
        shell: bash
        env:
          LOCK: ${{ needs.prepare.outputs.lock }}
          SHA: ${{ needs.prepare.outputs.candidate }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/mistral-asd-cpu"
          mkdir -p "$report"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$LOCK"
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all -- --check > "$report/fmt.log" 2>&1
          if ! cargo +stable check --locked -p mistralrs-core -p mistralrs-quant \
            -p mistralrs-paged-attn > "$report/check.log" 2>&1; then
            echo "::error::CPU check failed; final diagnostics:"
            tail -n 120 "$report/check.log"
            exit 1
          fi
          if ! cargo +stable test --locked -p mistralrs-quant --lib \
            > "$report/tests.log" 2>&1; then
            echo "::error::CPU unit tests failed; final diagnostics:"
            tail -n 120 "$report/tests.log"
            exit 1
          fi
          cp Cargo.lock "$report/Cargo.lock"
          jq -n --arg sha "$SHA" --arg lock "$LOCK" \
            '{schema_version:1,candidate_sha:$sha,lock_sha256:$lock,status:"CPU_PASSED"}' \
            > "$report/report.json"
      - name: Preserve CPU proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 / Node24
        with:
          name: mistral-asd-cpu-${{ github.run_id }}
          path: ${{ runner.temp }}/mistral-asd-cpu/
          if-no-files-found: warn
          retention-days: 90

  cuda_compile:
    needs: [prepare, cpu]
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: haricot/candle
          # Tooling-only pin: this commit contains the CUDA 12.9.2/Ubuntu 26.04
          # compiler container. It is intentionally independent from the
          # candle_asd_cuda source pin validated by prepare/Cargo.lock.
          ref: c565a96bd05374706bd13951f6d126f331f749ae
          path: .ci-tools
          persist-credentials: false
      - name: Build same hosted SM61 compiler image as Candle
        run: |
          set -euo pipefail
          docker build --pull \
            -f .ci-tools/.github/container/Containerfile.cuda1292-ubuntu2604 \
            -t mistral-asd-cuda1292 .ci-tools/.github/container
      - name: Compile Mistral.rs BF16, FP8 and FP4 for sm_61 without GPU execution
        shell: bash
        env:
          SHA: ${{ needs.prepare.outputs.candidate }}
          LOCK: ${{ needs.prepare.outputs.lock }}
          PUBLISH_BINARY: ${{ inputs.publish_binary }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mistral-asd-cuda" "$RUNNER_TEMP/asd-home" "$RUNNER_TEMP/asd-cargo"
          report="$RUNNER_TEMP/mistral-asd-cuda"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$LOCK"
          # Keep compiler progress visible, including during slow CUDA kernel builds.
          # This only changes future runs: the active run uses its pinned workflow SHA.
          touch "$report/compile.log"
          (
            while sleep 180; do
              printf 'CUDA build heartbeat: %s UTC; recent compiler output:\n' "$(date -u +%FT%TZ)"
              tail -n 6 "$report/compile.log" || true
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          docker run --rm --user "$(id -u):$(id -g)" \
            --security-opt=no-new-privileges \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:rw" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP:rw" \
            --workdir "$GITHUB_WORKSPACE" \
            --env "HOME=$RUNNER_TEMP/asd-home" \
            --env "CARGO_HOME=$RUNNER_TEMP/asd-cargo" \
            --env "RUSTUP_HOME=/opt/rustup" \
            --env "PATH=/usr/local/cuda-12.9/bin:/opt/cargo/bin:/usr/bin:/bin" \
            --env CUDA_HOME=/usr/local/cuda-12.9 \
            --env NVCC_CCBIN=/usr/bin/g++-14 \
            --env CC=/usr/bin/gcc-14 --env CXX=/usr/bin/g++-14 \
            --env CUDA_COMPUTE_CAP=61 \
            --env "PUBLISH_BINARY=$PUBLISH_BINARY" \
            mistral-asd-cuda1292 bash -euc '
              git config --global --add safe.directory "$PWD"
              nvcc --version
              if [[ "${PUBLISH_BINARY:-false}" == "true" ]]; then
                cargo build --locked --release -p mistralrs-cli --no-default-features \
                  --features cuda-legacy-bf16,cuda-legacy-fp8,cuda-legacy-fp4
                cargo test --locked --release -p mistralrs-core --no-default-features \
                  --features cuda-legacy-bf16,cuda-legacy-fp8,cuda-legacy-fp4 \
                  --test asd_sm61_smoke --no-run
              else
                cargo check --locked -p mistralrs-cli --no-default-features \
                  --features cuda-legacy-bf16,cuda-legacy-fp8,cuda-legacy-fp4
                cargo test --locked -p mistralrs-core --no-default-features \
                  --features cuda-legacy-bf16,cuda-legacy-fp8,cuda-legacy-fp4 \
                  --test asd_sm61_smoke --no-run
              fi
            ' 2>&1 | tee "$report/compile.log"
          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT
          if [[ "$PUBLISH_BINARY" == "true" ]]; then
            test -x target/release/mistralrs
            pkgdir="$report/package"
            mkdir -p "$pkgdir"
            cp target/release/mistralrs "$pkgdir/mistralrs"
            jq -n --arg sha "$SHA" --arg lock "$LOCK" --arg candle "89adbfa5b8af544f65ad33c7d2facf389e58704e" \
              '{schema_version:1,candidate_sha:$sha,lock_sha256:$lock,candle_sha:$candle,
                target:"linux-x86_64-sm61",cuda:"12.9.2",
                features:["cuda-legacy-bf16","cuda-legacy-fp8","cuda-legacy-fp4"]}' \
              > "$pkgdir/BUILD-METADATA.json"
            tar -C "$pkgdir" -czf "$report/mistralrs-linux-x86_64-sm61.tar.gz" \
              mistralrs BUILD-METADATA.json
            sha256sum "$report/mistralrs-linux-x86_64-sm61.tar.gz" \
              > "$report/mistralrs-linux-x86_64-sm61.tar.gz.sha256"
            rm -rf "$pkgdir"
          fi
          cp Cargo.lock "$report/Cargo.lock"
          jq -n --arg sha "$SHA" --arg lock "$LOCK" \
            '{schema_version:1,candidate_sha:$sha,lock_sha256:$lock,
              target:"sm_61",cuda:"12.9.2",gpu_executed:false,status:"CUDA_COMPILE_PASSED"}' \
            > "$report/report.json"
      - name: Preserve hosted CUDA proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mistral-asd-cuda-${{ github.run_id }}
          path: ${{ runner.temp }}/mistral-asd-cuda/
          if-no-files-found: warn
          retention-days: 90

  gpu:
    needs: [prepare, cpu, cuda_compile]
    runs-on: [self-hosted, linux, x64, cuda, sm61]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - name: Execute model-free physical Pascal smoke test
        shell: bash
        env:
          SHA: ${{ needs.prepare.outputs.candidate }}
          LOCK: ${{ needs.prepare.outputs.lock }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/mistral-asd-gpu"
          mkdir -p "$report"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$LOCK"
          nvidia-smi --query-gpu=name,compute_cap --format=csv,noheader > "$report/gpu.txt"
          grep -Eq ',[[:space:]]*6\.1([[:space:]]|$)' "$report/gpu.txt"
          if test -x /opt/cuda129/bin/nvcc; then
            export CUDA_HOME=/opt/cuda129 CUDA_ROOT=/opt/cuda129
            export PATH="/opt/cuda129/bin:$PATH"
          fi
          export CUDA_COMPUTE_CAP=61
          export NVCC_CCBIN=/usr/bin/g++-14
          rustup toolchain install stable --profile minimal
          nvcc --version > "$report/nvcc.txt"
          cargo +stable test --locked -p mistralrs-core --no-default-features \
            --features cuda-legacy-bf16,cuda-legacy-fp8,cuda-legacy-fp4 \
            --test asd_sm61_smoke -- --nocapture > "$report/smoke.log" 2>&1 || {
              tail -n 100 "$report/smoke.log"; exit 1;
            }
          jq -n --arg sha "$SHA" --arg lock "$LOCK" \
            '{schema_version:1,candidate_sha:$sha,lock_sha256:$lock,
              target:"sm_61",gpu_executed:true,status:"GPU_PASSED"}' > "$report/report.json"
      - name: Preserve physical GPU proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mistral-asd-gpu-${{ github.run_id }}
          path: ${{ runner.temp }}/mistral-asd-gpu/
          if-no-files-found: warn
          retention-days: 90

  promote:
    needs: [prepare, cpu, cuda_compile, gpu]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # Node24
        with:
          pattern: mistral-asd-*-${{ github.run_id }}
          path: ${{ runner.temp }}/asd-proof
          merge-multiple: false
      - name: Gate on three matching SHA and lock proofs; fast-forward only
        id: promote
        shell: bash
        env:
          SEED: ${{ needs.prepare.outputs.seed }}
          SHA: ${{ needs.prepare.outputs.candidate }}
          TEMP_REF: ${{ needs.prepare.outputs.candidate_ref }}
          LOCK: ${{ needs.prepare.outputs.lock }}
        run: |
          set -euo pipefail
          for gate in cpu cuda gpu; do
            report="$RUNNER_TEMP/asd-proof/mistral-asd-${gate}-${GITHUB_RUN_ID}/report.json"
            test -s "$report"
            jq -e --arg sha "$SHA" --arg lock "$LOCK" --arg gate "$gate" \
              '.candidate_sha==$sha and .lock_sha256==$lock and
              (( $gate=="cpu" and .status=="CPU_PASSED" ) or
               ( $gate=="cuda" and .status=="CUDA_COMPILE_PASSED" and .gpu_executed==false ) or
               ( $gate=="gpu" and .status=="GPU_PASSED" and .gpu_executed==true ))' \
              "$report" >/dev/null
          done
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$LOCK"
          remote="$(git ls-remote origin refs/heads/asd_runner | cut -f1)"
          test "$remote" = "$SEED" || { echo "::error::asd_runner moved; no promotion"; exit 3; }
          git merge-base --is-ancestor "$SEED" "$SHA"
          git push origin "$SHA:refs/heads/asd_runner"
          tag="promoted/asd_runner/${SHA:0:12}-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" "$SHA" \
            -m "Mistral.rs ASD CPU + hosted sm61 CUDA + physical Pascal proof, run ${GITHUB_RUN_ID}"
          git push origin "refs/tags/$tag"
          current="$(git ls-remote origin "refs/heads/$TEMP_REF" | cut -f1)"
          if test "$current" = "$SHA"; then
            git push origin ":refs/heads/$TEMP_REF"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "PROMOTED asd_runner $SHA after three matching proofs; tag $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish promoted SM61 binary release
        if: ${{ inputs.publish_binary }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.promote.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.candidate }}
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/asd-proof/mistral-asd-cuda-${GITHUB_RUN_ID}/mistralrs-linux-x86_64-sm61.tar.gz"
          sum="${pkg}.sha256"
          test -s "$pkg"
          test -s "$sum"
          gh release create "$TAG" "$pkg#Linux x86_64 SM61 binary" "$sum#SHA-256" \
            --verify-tag --prerelease \
            --title "mistral.rs ASD SM61 ${SHA:0:12}" \
            --notes "Promoted asd_runner candidate $SHA, validated on CPU, hosted CUDA 12.9.2 SM61 compilation, and a physical Pascal SM61 GPU. Candle: 89adbfa5b8af544f65ad33c7d2facf389e58704e. Features: cuda-legacy-bf16, cuda-legacy-fp8, cuda-legacy-fp4."
