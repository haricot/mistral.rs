name: Mistral ASD Integration
on:
  workflow_dispatch:
    inputs:
      expected_seed_sha:
        description: Optional expected asd_runner SHA; leave empty to pin the current asd_runner head automatically
        required: false
        default: ""
        type: string
      expected_candle_sha:
        description: Optional expected haricot/candle:extended SHA; leave empty to pin the current validated extended head
        required: false
        default: ""
        type: string
      publish_binary:
        description: Build and publish a downloadable Linux x86_64 SM61 binary after promotion
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: mistral-asd-integration
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/mirror_orch'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      seed: ${{ steps.pin.outputs.seed }}
      candidate: ${{ steps.pin.outputs.candidate }}
      candidate_ref: ${{ steps.pin.outputs.candidate_ref }}
      lock: ${{ steps.pin.outputs.lock }}
      candle: ${{ steps.pin.outputs.candle }}
      candle_validation_ref: ${{ steps.pin.outputs.candle_validation_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # Node24
        with:
          ref: asd_runner
          fetch-depth: 0
          persist-credentials: true
      - name: Resolve immutable source set and Cargo.lock
        id: pin
        shell: bash
        env:
          EXPECTED_SEED: ${{ inputs.expected_seed_sha }}
          EXPECTED_CANDLE: ${{ inputs.expected_candle_sha }}
        run: |
          set -euo pipefail
          seed="$(git rev-parse HEAD)"
          if [[ -n "${EXPECTED_SEED}" ]]; then
            [[ "${EXPECTED_SEED}" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::expected_seed_sha must be empty or exactly one full 40-character SHA'; exit 2; }
            if [[ "${EXPECTED_SEED}" != "${seed}" ]]; then
              echo "::error::expected_seed_sha is not the current asd_runner head (actual: $seed)"; exit 3
            fi
          fi
          remote_seed="$(git ls-remote origin refs/heads/asd_runner | cut -f1)"
          [[ "$remote_seed" == "$seed" ]] || { echo '::error::Source moved during checkout'; exit 3; }

          candle_repo="https://github.com/haricot/candle.git"
          candle_branch="extended"
          candle="$(git ls-remote --heads "$candle_repo" "refs/heads/$candle_branch" | cut -f1)"
          [[ "$candle" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Cannot resolve haricot/candle:extended'; exit 3; }
          if [[ -n "${EXPECTED_CANDLE}" ]]; then
            [[ "${EXPECTED_CANDLE}" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::expected_candle_sha must be empty or exactly one full 40-character SHA'; exit 2; }
            [[ "${EXPECTED_CANDLE}" == "$candle" ]] || {
              echo "::error::haricot/candle:extended moved from requested SHA (actual: $candle)"; exit 3;
            }
          fi

          candle_validation_ref="$(
            git ls-remote --heads "$candle_repo" 'refs/heads/archive/extended/sm61-validated-*' |
              awk -v sha="$candle" '$1 == sha { print $2; exit }'
          )"
          [[ -n "$candle_validation_ref" ]] || {
            echo "::error::haricot/candle:extended $candle has no physical SM61 validation archive"; exit 3;
          }

          candle_checkout="$RUNNER_TEMP/candle-extended"
          rm -rf "$candle_checkout"
          git clone --quiet --no-tags --filter=blob:none --single-branch --branch "$candle_branch" \
            "$candle_repo" "$candle_checkout"
          [[ "$(git -C "$candle_checkout" rev-parse HEAD)" == "$candle" ]] || {
            echo '::error::Candle extended moved during checkout'; exit 3;
          }
          jq -e '
            .schema_version==1 and
            .kind=="extended-six" and
            .integration_target=="extended" and
            ([.features[].feature] | sort) ==
              (["asd_core_v3_standalone","bf16_candle","cudnn_fallback_candle","fp4_candle","fp8_candle","moe_simt_f16_candle"] | sort)
          ' "$candle_checkout/candle-integration/extended.json" >/dev/null

          git merge-base --is-ancestor "20f607a77abd4738aa5594ee93a393a9fd284605" HEAD
          git merge-base --is-ancestor "d3813494903e5cfca01e12df596f3fe14a5d22ba" HEAD

          python3 - "$candle" <<'PY'
          import re
          import sys
          from pathlib import Path

          candle = sys.argv[1]
          path = Path("Cargo.toml")
          text = path.read_text()
          crates = ("candle-core", "candle-nn", "candle-flash-attn-v3", "candle-metal-kernels")
          for crate in crates:
              pattern = re.compile(
                  rf'(?m)^({re.escape(crate)}\s*=\s*\{{[^\n}}]*git\s*=\s*"https://github.com/haricot/candle\.git"[^\n}}]*rev\s*=\s*")[0-9a-f]{{40}}("[^\n}}]*\}}\s*)$'
              )
              text, count = pattern.subn(rf'\g<1>{candle}\g<2>', text)
              if count != 1:
                  raise SystemExit(f"expected exactly one pinned haricot/candle dependency for {crate}, got {count}")
          path.write_text(text)
          PY

          tmp_sources="$(mktemp)"
          jq \
            --arg candle "$candle" \
            --arg candle_branch "$candle_branch" \
            --arg validation_ref "$candle_validation_ref" \
            '.candle_repository="haricot/candle"
             | .candle_branch=$candle_branch
             | .candle_sha=$candle
             | .candle_validation_ref=$validation_ref
             | .comment="Physical Pascal gate uses the exact validated haricot/candle:extended SHA, CPU-resolved Cargo.lock, hosted SM61 compile, and physical SM61 runtime proof"' \
            mistral-integration/sources.json > "$tmp_sources"
          mv "$tmp_sources" mistral-integration/sources.json

          jq -e --arg candle "$candle" \
            --arg candle_branch "$candle_branch" \
            --arg validation_ref "$candle_validation_ref" \
            --arg base "20f607a77abd4738aa5594ee93a393a9fd284605" \
            --arg sm61 "d3813494903e5cfca01e12df596f3fe14a5d22ba" \
            '.schema_version==1 and
             .candle_repository=="haricot/candle" and
             .candle_branch==$candle_branch and
             .candle_sha==$candle and
             .candle_validation_ref==$validation_ref and
             .base_master_sha==$base and
             .sm61_source_sha==$sm61 and
             (.features | sort) == (["cuda-legacy-bf16","cuda-legacy-fp8","cuda-legacy-fp4"] | sort)' \
            mistral-integration/sources.json >/dev/null
          rustup toolchain install stable --profile minimal --component rustfmt
          report="$RUNNER_TEMP/mistral-asd-preflight"
          mkdir -p "$report"
          if ! cargo +stable fmt --all -- --check > "$report/fmt.log" 2>&1; then
            echo "::error::Rustfmt preflight failed on the exact asd_runner seed"
            cat "$report/fmt.log"
            exit 1
          fi
          cargo +stable update --workspace
          cargo +stable metadata --locked --format-version 1 > "$RUNNER_TEMP/asd-metadata.json"
          grep -Fq "$candle" Cargo.lock
          lock="$(sha256sum Cargo.lock | cut -d' ' -f1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock mistral-integration/sources.json
          if ! git diff --cached --quiet; then
            git commit -m "build(asd): pin validated Candle extended ${candle:0:12}"
          fi
          candidate="$(git rev-parse HEAD)"
          ref="integration/asd_runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/${ref}"
          echo "seed=${seed}" >> "$GITHUB_OUTPUT"
          echo "candidate=${candidate}" >> "$GITHUB_OUTPUT"
          echo "candidate_ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "lock=${lock}" >> "$GITHUB_OUTPUT"
          echo "candle=${candle}" >> "$GITHUB_OUTPUT"
          echo "candle_validation_ref=${candle_validation_ref}" >> "$GITHUB_OUTPUT"
          printf 'Candidate %s, lock %s, Candle extended %s (%s)\n' \
            "$candidate" "$lock" "$candle" "$candle_validation_ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve preflight diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # Node24
        with:
          name: mistral-asd-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/mistral-asd-preflight/
          if-no-files-found: ignore
          retention-days: 21

  cpu:
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - name: Check CPU, formatting and exact lock
        shell: bash
        env:
          LOCK: ${{ needs.prepare.outputs.lock }}
          SHA: ${{ needs.prepare.outputs.candidate }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/mistral-asd-cpu"
          mkdir -p "$report"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$LOCK"
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --all -- --check > "$report/fmt.log" 2>&1
          if ! cargo +stable check --locked -p mistralrs-core -p mistralrs-quant \
            -p mistralrs-paged-attn > "$report/check.log" 2>&1; then
            echo "::error::CPU check failed; final diagnostics:"
            tail -n 120 "$report/check.log"
            exit 1
          fi
          if ! cargo +stable test --locked -p mistralrs-quant --lib \
            > "$report/tests.log" 2>&1; then
            echo "::error::CPU unit tests failed; final diagnostics:"
            tail -n 120 "$report/tests.log"
            exit 1
          fi
          cp Cargo.lock "$report/Cargo.lock"
          jq -n --arg sha "$SHA" --arg lock "$LOCK" \
            '{schema_version:1,candidate_sha:$sha,lock_sha256:$lock,status:"CPU_PASSED"}' \
            > "$report/report.json"
      - name: Preserve CPU proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 / Node24
        with:
          name: mistral-asd-cpu-${{ github.run_id }}
          path: ${{ runner.temp }}/mistral-asd-cpu/
          if-no-files-found: warn
          retention-days: 90

  cuda_compile:
    needs: [prepare, cpu]
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: haricot/candle
          # Use the exact physically validated Candle Extended commit for both
          # source dependencies and the hosted CUDA 12.9.2 compiler tooling.
          ref: ${{ needs.prepare.outputs.candle }}
          path: .ci-tools
          persist-credentials: false
      - name: Build same hosted SM61 compiler image as Candle
        run: |
          set -euo pipefail
          docker build --pull \
            -f .ci-tools/.github/container/Containerfile.cuda1292-ubuntu2604 \
            -t mistral-asd-cuda1292 .ci-tools/.github/container
      - name: Compile Mistral.rs BF16, FP8 and FP4 for sm_61 without GPU execution
        shell: bash
        env:
          SHA: ${{ needs.prepare.outputs.candidate }}
          LOCK: ${{ needs.prepare.outputs.lock }}
          PUBLISH_BINARY: ${{ inputs.publish_binary }}
          CANDLE_SHA: ${{ needs.prepare.outputs.candle }}
          CANDLE_VALIDATION_REF: ${{ needs.prepare.outputs.candle_validation_ref }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mistral-asd-cuda" "$RUNNER_TEMP/asd-home" "$RUNNER_TEMP/asd-cargo"
          report="$RUNNER_TEMP/mistral-asd-cuda"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$LOCK"
          # Keep compiler progress visible, including during slow CUDA kernel builds.
          # This only changes future runs: the active run uses its pinned workflow SHA.
          touch "$report/compile.log"
          (
            while sleep 180; do
              printf 'CUDA build heartbeat: %s UTC; recent compiler output:\n' "$(date -u +%FT%TZ)"
              tail -n 6 "$report/compile.log" || true
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          docker run --rm --user "$(id -u):$(id -g)" \
            --security-opt=no-new-privileges \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:rw" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP:rw" \
            --workdir "$GITHUB_WORKSPACE" \
            --env "HOME=$RUNNER_TEMP/asd-home" \
            --env "CARGO_HOME=$RUNNER_TEMP/asd-cargo" \
            --env "RUSTUP_HOME=/opt/rustup" \
            --env "PATH=/usr/local/cuda-12.9/bin:/opt/cargo/bin:/usr/bin:/bin" \
            --env CUDA_HOME=/usr/local/cuda-12.9 \
            --env NVCC_CCBIN=/usr/bin/g++-14 \
            --env CC=/usr/bin/gcc-14 --env CXX=/usr/bin/g++-14 \
            --env CUDA_COMPUTE_CAP=61 \
            --env "PUBLISH_BINARY=$PUBLISH_BINARY" \
            mistral-asd-cuda1292 bash -euc '
              git config --global --add safe.directory "$PWD"
              nvcc --version
              if [[ "${PUBLISH_BINARY:-false}" == "true" ]]; then
                cargo build --locked --release -p mistralrs-cli --no-default-features \
                  --features cuda-legacy-bf16,cuda-legacy-fp8,cuda-legacy-fp4
                cargo test --locked --release -p mistralrs-core --no-default-features \
                  --features cuda-legacy-bf16,cuda-legacy-fp8,cuda-legacy-fp4 \
                  --test asd_sm61_smoke --no-run
              else
                cargo check --locked -p mistralrs-cli --no-default-features \
                  --features cuda-legacy-bf16,cuda-legacy-fp8,cuda-legacy-fp4
                cargo test --locked -p mistralrs-core --no-default-features \
                  --features cuda-legacy-bf16,cuda-legacy-fp8,cuda-legacy-fp4 \
                  --test asd_sm61_smoke --no-run
              fi
            ' 2>&1 | tee "$report/compile.log"
          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT
          if [[ "$PUBLISH_BINARY" == "true" ]]; then
            test -x target/release/mistralrs
            pkgdir="$report/package"
            mkdir -p "$pkgdir"
            cp target/release/mistralrs "$pkgdir/mistralrs"
            jq -n --arg sha "$SHA" --arg lock "$LOCK" --arg candle "$CANDLE_SHA" \
              --arg candle_validation_ref "$CANDLE_VALIDATION_REF" \
              '{schema_version:1,candidate_sha:$sha,lock_sha256:$lock,candle_sha:$candle,
                candle_validation_ref:$candle_validation_ref,candle_branch:"extended",
                target:"linux-x86_64-sm61",cuda:"12.9.2",
                features:["cuda-legacy-bf16","cuda-legacy-fp8","cuda-legacy-fp4"]}' \
              > "$pkgdir/BUILD-METADATA.json"
            tar -C "$pkgdir" -czf "$report/mistralrs-linux-x86_64-sm61.tar.gz" \
              mistralrs BUILD-METADATA.json
            sha256sum "$report/mistralrs-linux-x86_64-sm61.tar.gz" \
              > "$report/mistralrs-linux-x86_64-sm61.tar.gz.sha256"
            rm -rf "$pkgdir"
          fi
          cp Cargo.lock "$report/Cargo.lock"
          jq -n --arg sha "$SHA" --arg lock "$LOCK" \
            '{schema_version:1,candidate_sha:$sha,lock_sha256:$lock,
              target:"sm_61",cuda:"12.9.2",gpu_executed:false,status:"CUDA_COMPILE_PASSED"}' \
            > "$report/report.json"
      - name: Preserve hosted CUDA proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mistral-asd-cuda-${{ github.run_id }}
          path: ${{ runner.temp }}/mistral-asd-cuda/
          if-no-files-found: warn
          retention-days: 90

  gpu:
    needs: [prepare, cpu, cuda_compile]
    runs-on: [self-hosted, linux, x64, cuda, sm61]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - name: Execute model-free physical Pascal smoke test
        shell: bash
        env:
          SHA: ${{ needs.prepare.outputs.candidate }}
          LOCK: ${{ needs.prepare.outputs.lock }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/mistral-asd-gpu"
          mkdir -p "$report"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$LOCK"
          nvidia-smi --query-gpu=name,compute_cap --format=csv,noheader > "$report/gpu.txt"
          grep -Eq ',[[:space:]]*6\.1([[:space:]]|$)' "$report/gpu.txt"
          if test -x /opt/cuda129/bin/nvcc; then
            export CUDA_HOME=/opt/cuda129 CUDA_ROOT=/opt/cuda129
            export PATH="/opt/cuda129/bin:$PATH"
          fi
          export CUDA_COMPUTE_CAP=61
          export NVCC_CCBIN=/usr/bin/g++-14
          rustup toolchain install stable --profile minimal
          nvcc --version > "$report/nvcc.txt"
          cargo +stable test --locked -p mistralrs-core --no-default-features \
            --features cuda-legacy-bf16,cuda-legacy-fp8,cuda-legacy-fp4 \
            --test asd_sm61_smoke -- --nocapture > "$report/smoke.log" 2>&1 || {
              tail -n 100 "$report/smoke.log"; exit 1;
            }
          jq -n --arg sha "$SHA" --arg lock "$LOCK" \
            '{schema_version:1,candidate_sha:$sha,lock_sha256:$lock,
              target:"sm_61",gpu_executed:true,status:"GPU_PASSED"}' > "$report/report.json"
      - name: Preserve physical GPU proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mistral-asd-gpu-${{ github.run_id }}
          path: ${{ runner.temp }}/mistral-asd-gpu/
          if-no-files-found: warn
          retention-days: 90

  promote:
    needs: [prepare, cpu, cuda_compile, gpu]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # Node24
        with:
          pattern: mistral-asd-*-${{ github.run_id }}
          path: ${{ runner.temp }}/asd-proof
          merge-multiple: false
      - name: Gate on matching proofs, archive, and force-with-lease promote
        id: promote
        shell: bash
        env:
          SEED: ${{ needs.prepare.outputs.seed }}
          SHA: ${{ needs.prepare.outputs.candidate }}
          TEMP_REF: ${{ needs.prepare.outputs.candidate_ref }}
          LOCK: ${{ needs.prepare.outputs.lock }}
          CANDLE_SHA: ${{ needs.prepare.outputs.candle }}
          CANDLE_VALIDATION_REF: ${{ needs.prepare.outputs.candle_validation_ref }}
        run: |
          set -euo pipefail
          for gate in cpu cuda gpu; do
            report="$RUNNER_TEMP/asd-proof/mistral-asd-${gate}-${GITHUB_RUN_ID}/report.json"
            test -s "$report"
            jq -e --arg sha "$SHA" --arg lock "$LOCK" --arg gate "$gate" \
              '.candidate_sha==$sha and .lock_sha256==$lock and
              (( $gate=="cpu" and .status=="CPU_PASSED" ) or
               ( $gate=="cuda" and .status=="CUDA_COMPILE_PASSED" and .gpu_executed==false ) or
               ( $gate=="gpu" and .status=="GPU_PASSED" and .gpu_executed==true ))' \
              "$report" >/dev/null
          done
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$LOCK"
          test "$(jq -r '.candle_sha' mistral-integration/sources.json)" = "$CANDLE_SHA"
          test "$(jq -r '.candle_branch' mistral-integration/sources.json)" = "extended"
          test "$(jq -r '.candle_validation_ref' mistral-integration/sources.json)" = "$CANDLE_VALIDATION_REF"

          remote="$(git ls-remote origin refs/heads/asd_runner | cut -f1)"
          if test "$remote" != "$SEED" && test "$remote" != "$SHA"; then
            echo "::error::asd_runner moved unexpectedly ($remote); no promotion"; exit 3
          fi
          git merge-base --is-ancestor "$SEED" "$SHA"

          before_ref="archive/asd_runner/pre-promote-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          validated_ref="archive/asd_runner/sm61-validated-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for spec in "$SEED:$before_ref" "$SHA:$validated_ref"; do
            value="${spec%%:*}"
            ref="${spec#*:}"
            current="$(git ls-remote origin "refs/heads/$ref" | cut -f1)"
            if test -n "$current"; then
              test "$current" = "$value" || {
                echo "::error::archive $ref already exists at unexpected SHA $current"; exit 3;
              }
            else
              git push origin "$value:refs/heads/$ref"
            fi
          done

          if test "$remote" = "$SEED"; then
            git push --force-with-lease="refs/heads/asd_runner:$SEED" \
              origin "$SHA:refs/heads/asd_runner"
          fi
          test "$(git ls-remote origin refs/heads/asd_runner | cut -f1)" = "$SHA"

          tag="promoted/asd_runner/${SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git tag -a "$tag" "$SHA" \
              -m "Mistral.rs ASD CPU + hosted SM61 CUDA + physical Pascal proof, run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}; Candle extended $CANDLE_SHA"
            git push origin "refs/tags/$tag"
          fi

          current="$(git ls-remote origin "refs/heads/$TEMP_REF" | cut -f1)"
          if test "$current" = "$SHA"; then
            git push origin ":refs/heads/$TEMP_REF"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "PROMOTED asd_runner $SHA after CPU + hosted CUDA + physical SM61 proofs; Candle extended $CANDLE_SHA; archives $before_ref and $validated_ref; tag $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish promoted SM61 binary release
        if: ${{ inputs.publish_binary }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.promote.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.candidate }}
          CANDLE_SHA: ${{ needs.prepare.outputs.candle }}
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/asd-proof/mistral-asd-cuda-${GITHUB_RUN_ID}/mistralrs-linux-x86_64-sm61.tar.gz"
          sum="${pkg}.sha256"
          test -s "$pkg"
          test -s "$sum"
          gh release create "$TAG" "$pkg#Linux x86_64 SM61 binary" "$sum#SHA-256" \
            --verify-tag --prerelease \
            --title "mistral.rs ASD SM61 ${SHA:0:12}" \
