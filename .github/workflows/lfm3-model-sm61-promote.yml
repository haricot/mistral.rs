name: Publish original Mistral candidates with verified real-model evidence
on:
  workflow_dispatch:
    inputs:
      evidence_run:
        description: Successful dedicated LFM3 model qualification run
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: mistral-model-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/mirror_orch'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Verify complete model evidence and original CPU GPU archives before atomic promotion
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: ${{ inputs.evidence_run }}
        run: python3 .github/lfm3/qualification.py promote --output "$RUNNER_TEMP/promotion" --evidence-run "$EVIDENCE_RUN"
