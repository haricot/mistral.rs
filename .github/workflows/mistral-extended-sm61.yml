name: Mistral Extended SM61
run-name: 'SM61 shared qualification — Extended + Legacy (one GPU session)'
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mistral-standalone-campaign
  cancel-in-progress: false
jobs:
  prepare:
    name: prepare
    if: github.ref == 'refs/heads/mirror_orch'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
      cache_key: ${{ steps.prepare.outputs.cache_key }}
      recipe: ${{ steps.prepare.outputs.recipe }}
      bundle_key: ${{ steps.prepare.outputs.bundle_key }}
      environment_key: ${{ steps.prepare.outputs.environment_key }}
      compiler_artifact: ${{ steps.prepare.outputs.compiler_artifact }}
      compiler_artifact_id: ${{ steps.prepare.outputs.compiler_artifact_id || steps.compiler_image.outputs.artifact-id }}
    steps:
      - name: Free unused hosted toolchains for CUDA images and archives
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned preparation toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Prepare independent sources and lock composition
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/campaign"
          mkdir -p "$report"
          base="$(python3 -c 'import json;print(json.load(open(".github/campaign/config.json"))["base_image"])')"
          image_digest="$(docker buildx imagetools inspect "$base" --format '{{json .Manifest.Digest}}' | tr -d '\"')"
          base="$base@$image_digest"
          compiler_key="$(python3 - "$base" <<'PYCODE'
          import hashlib,json,pathlib,sys
          files={n:hashlib.sha256((pathlib.Path('.github/campaign')/n).read_bytes()).hexdigest() for n in ('Containerfile','install-tools.py','config.json')}
          print(hashlib.sha256(json.dumps([sys.argv[1],files],sort_keys=True).encode()).hexdigest())
          PYCODE
          )"
          prefix="mistral-compiler-$compiler_key-"
          prior="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq ".artifacts[] | select(.expired==false and .workflow_run.head_branch==\"mirror_orch\" and (.name | startswith(\"$prefix\"))) | [.id,.name] | @tsv" | sed -n '1p')"
          if [[ -n "$prior" ]]; then
            read -r artifact_id artifact_name <<< "$prior"
            image_id="sha256:${artifact_name##*-}"
            [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "compiler_artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
            echo 'compiler_cached=true' >> "$GITHUB_OUTPUT"
          else
            docker build --provenance=false --build-arg "BASE_IMAGE=$base" -f .github/campaign/Containerfile -t mistral-campaign .github/campaign
            image_id="$(docker image inspect mistral-campaign --format '{{.Id}}')"
            artifact_name="$prefix${image_id#sha256:}"
            mkdir -p "$RUNNER_TEMP/compiler-image"
            docker save mistral-campaign | zstd -T2 -3 -o "$RUNNER_TEMP/compiler-image/image.tar.zst"
            python3 - "$RUNNER_TEMP/compiler-image" "$image_id" "$compiler_key" <<'PYCODE'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          with (root/'image.tar.zst').open('rb') as stream:
              sha=hashlib.file_digest(stream,'sha256').hexdigest()
          (root/'compiler.json').write_text(json.dumps({'image_id':sys.argv[2],'compiler_key':sys.argv[3],'archive_sha256':sha})+'\n')
          PYCODE
          fi
          echo "compiler_artifact=$artifact_name" >> "$GITHUB_OUTPUT"
          image="mistral-compiler@${image_id}"
          python3 .github/campaign/campaign.py snapshot --repo "$PWD" --target extended --image "$image" --output "$report/snapshot.json"
          python3 .github/campaign/campaign.py prepare --repo "$PWD" --snapshot "$report/snapshot.json" --output "$report" --publish
          candidate="$(jq -r .candidate "$report/plan.json")"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "cache_key=$(jq -r .input_key "$report/plan.json")" >> "$GITHUB_OUTPUT"
          echo "recipe=$(jq -r .recipe "$report/plan.json")" >> "$GITHUB_OUTPUT"
          echo "environment_key=$(python3 -c 'import hashlib,json,sys;p=json.load(open(sys.argv[1]));print(hashlib.sha256(json.dumps([p["image"],p["config"]["toolchain"],p["config"]["features"],"sm61","bf16,fp8"],sort_keys=True).encode()).hexdigest())' "$report/plan.json")" >> "$GITHUB_OUTPUT"
          if [[ extended == extended ]]; then
            git push origin "$candidate:refs/heads/integration/asd_runner-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          echo "bundle_key=$(python3 -c 'import hashlib,json,sys;print(hashlib.sha256(json.dumps(sorted(n["build_key"] for n in json.load(open(sys.argv[1]))["matrix"])).encode()).hexdigest())' "$report/plan.json")" >> "$GITHUB_OUTPUT"
          cp -a .github/campaign "$report/orchestrator"
          echo "candidate=$candidate; CUDA-enabled build, CPU runtime tests and archived physical execution" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: compiler_image
        if: always() && steps.prepare.outputs.compiler_cached != 'true' && steps.prepare.outputs.compiler_artifact != ''
        with:
          name: ${{ steps.prepare.outputs.compiler_artifact }}
          path: ${{ runner.temp }}/compiler-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mistral-asd-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/campaign/
          if-no-files-found: warn
          retention-days: 30
  cpu:
    name: cpu
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate preparation and publication contracts
        run: python3 -B -m unittest discover -v -s .github/campaign/tests
  cuda_compile:
    name: cuda_compile
    needs: [prepare, cpu]
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    steps:
      - name: Free unused hosted toolchains for CUDA images and archives
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-asd-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/campaign
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: compile_cache
        with:
          path: ${{ runner.temp }}/campaign-cache
          key: mistral-sm61-${{ needs.prepare.outputs.environment_key }}-${{ needs.prepare.outputs.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mistral-sm61-${{ needs.prepare.outputs.environment_key }}-${{ needs.prepare.outputs.cache_key }}-
            mistral-sm61-${{ needs.prepare.outputs.environment_key }}-
      - name: Restore an identical verified build bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_BUNDLE: mistral-builds-${{ needs.prepare.outputs.bundle_key }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/builds"
          prior="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$BUILD_BUNDLE&per_page=100" --jq '.artifacts[] | select(.expired==false and .workflow_run.head_branch=="mirror_orch") | .id' | head -n 1)"
          if [[ -n "$prior" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$prior/zip" > "$RUNNER_TEMP/prior-builds.zip"
            unzip -oq "$RUNNER_TEMP/prior-builds.zip" -d "$RUNNER_TEMP/builds"
            valid=true
            while read -r component; do
              python3 "$RUNNER_TEMP/campaign/orchestrator/proof.py" verify "$RUNNER_TEMP/builds/$component" "$component" --plan "$RUNNER_TEMP/campaign/plan.json" || valid=false
            done < <(jq -r '.matrix[].component' "$RUNNER_TEMP/campaign/plan.json")
            if [[ "$valid" == true ]]; then
              echo 'REUSE_BUILD=true' >> "$GITHUB_ENV"
              echo 'Reusing matching executable archives and CPU execution proofs' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Restore the exact compiler image archive
        if: env.REUSE_BUILD != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILER_ARTIFACT_ID: ${{ needs.prepare.outputs.compiler_artifact_id }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/compiler-image"
          mkdir -p "$root"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$COMPILER_ARTIFACT_ID/zip" > "$RUNNER_TEMP/compiler-image.zip"
          unzip -oq "$RUNNER_TEMP/compiler-image.zip" -d "$root"
          rm "$RUNNER_TEMP/compiler-image.zip"
          image_id="$(python3 - "$root" "$RUNNER_TEMP/campaign/plan.json" <<'PYCODE'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); manifest=json.loads((root/'compiler.json').read_text())
          expected=json.load(open(sys.argv[2]))['image'].split('@',1)[1]
          assert manifest['image_id']==expected, 'compiler image identity mismatch'
          with (root/'image.tar.zst').open('rb') as stream:
              assert hashlib.file_digest(stream,'sha256').hexdigest()==manifest['archive_sha256'], 'compiler archive digest mismatch'
          print(expected)
          PYCODE
          )"
          zstd -dc "$root/image.tar.zst" | docker load
          test "$(docker image inspect mistral-campaign --format '{{.Id}}')" = "$image_id"
          rm -rf "$root"
      - name: Verify hosted CPU loader before expensive compilation
        if: env.REUSE_BUILD != 'true'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint python3 \
            -v "$RUNNER_TEMP:$RUNNER_TEMP:ro" mistral-campaign \
            "$RUNNER_TEMP/campaign/orchestrator/cpu-runtime.py" -- \
            python3 -c 'import ctypes; assert ctypes.CDLL("libcuda.so.1").cuInit(0) == 34'
      - name: Compile each independent source and run CPU tests with CUDA enabled
        if: env.REUSE_BUILD != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/campaign/plan.json"
          mkdir -p "$RUNNER_TEMP/builds" "$RUNNER_TEMP/campaign-cache" "$RUNNER_TEMP/campaign-home"
          git fetch "$RUNNER_TEMP/campaign/candidate.bundle" 'refs/heads/integration/campaign/*:refs/remotes/build/*'
          while read -r component sha key; do
            dir="$RUNNER_TEMP/builds/$component"
            mkdir -p "$dir"
            docker run --rm --user "$(id -u):$(id -g)" --security-opt=no-new-privileges --entrypoint /bin/bash \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:rw" -v "$RUNNER_TEMP:$RUNNER_TEMP:rw" \
              -w "$GITHUB_WORKSPACE" -e "HOME=$RUNNER_TEMP/campaign-home" \
              -e "CAMPAIGN_CACHE=$RUNNER_TEMP/campaign-cache" \
              mistral-campaign "$RUNNER_TEMP/campaign/orchestrator/build.sh" "$dir" "$plan" "$component"
          done < <(jq -r '.matrix[] | [.component,.candidate,.build_key] | @tsv' "$plan")
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && env.REUSE_BUILD != 'true' && steps.compile_cache.outputs.cache-primary-key != ''
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/campaign-cache
          key: ${{ steps.compile_cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: mistral-build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/builds/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: mistral-builds-${{ needs.prepare.outputs.bundle_key }}
          path: ${{ runner.temp }}/builds/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
          compression-level: 0
  gpu:
    name: SM61 Mistral Extended runtime (candidate=${{ needs.prepare.outputs.candidate }})
    needs: [prepare, cpu, cuda_compile]
    runs-on: [mistral-extended, "mistral-extended-${{ github.run_id }}"]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-asd-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/campaign
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-builds-${{ needs.prepare.outputs.bundle_key }}
          path: ${{ runner.temp }}/builds
      - name: Prepare nextest extraction directories
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r component; do
            mkdir -p "$RUNNER_TEMP/gpu-proof/target-$component"
          done < <(python3 -c 'import json,sys; [print(n["component"]) for n in json.load(open(sys.argv[1]))["matrix"]]' "$RUNNER_TEMP/campaign/plan.json")
          lscpu > "$RUNNER_TEMP/gpu-proof/cpu.txt"
      - name: Execute hosted archives on physical Pascal
        run: bash "$RUNNER_TEMP/campaign/orchestrator/gpu.sh" "$RUNNER_TEMP/campaign/plan.json" "$RUNNER_TEMP/builds" "$RUNNER_TEMP/gpu-proof"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mistral-asd-gpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gpu-proof/
            !${{ runner.temp }}/gpu-proof/target-*/**
          if-no-files-found: warn
          retention-days: 30
  promote:
    needs: [prepare, cpu, cuda_compile, gpu]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-asd-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/campaign
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-builds-${{ needs.prepare.outputs.bundle_key }}
          path: ${{ runner.temp }}/proofs
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-asd-gpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proofs/gpu
      - name: Publish verified standalones and final branch atomically
        run: |
          git fetch "$RUNNER_TEMP/campaign/candidate.bundle" 'refs/heads/integration/campaign/*:refs/remotes/build/*'
          python3 "$RUNNER_TEMP/campaign/orchestrator/campaign.py" promote --repo "$PWD" --plan "$RUNNER_TEMP/campaign/plan.json" --proofs "$RUNNER_TEMP/proofs" --run-id "$GITHUB_RUN_ID"
