name: Mistral Extended SM61
on:
  workflow_dispatch:
    inputs:
      qualification_only:
        description: Qualify without promoting branches or publishing an image
        type: boolean
        default: false
  # One-shot LFM3 qualification. This does not run on every master sync.
  push:
    branches: [mirror_orch]
    paths:
      - '.github/campaign/lfm3-sm61-qualification.once'
      - '.github/campaign/cuda-reuse-extended.once'
permissions:
  contents: read
  packages: read
concurrency:
  group: mistral-extended-campaign-${{ github.ref }}
  queue: max
  cancel-in-progress: false
jobs:
  cuda_image:
    uses: ./.github/workflows/mistral-cuda-ci-image.yml
    permissions:
      contents: read
      packages: write

  prepare:
    needs: cuda_image
    name: prepare
    if: >-
      github.ref == 'refs/heads/mirror_orch' ||
      (github.event_name == 'workflow_dispatch' && inputs.qualification_only == true &&
       github.ref == 'refs/heads/ci/extended-release-r1-single-build')
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      CI_CUDA_IMAGE: ${{ needs.cuda_image.outputs.image }}
      CAMPAIGN_TARGET: extended
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
      cache_key: ${{ steps.prepare.outputs.cache_key }}
      recipe: ${{ steps.prepare.outputs.recipe }}
      bundle_key: ${{ steps.prepare.outputs.bundle_key }}
      environment_key: ${{ steps.prepare.outputs.environment_key }}
    steps:
      - name: Free unused hosted toolchains for CUDA images and archives
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pull the verified immutable CUDA environment
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$CI_CUDA_IMAGE"
      - name: Prepare independent sources and lock composition
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/campaign/prepare-hosted.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mistral-asd-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/campaign/
          if-no-files-found: warn
          retention-days: 30
  cpu:
    name: cpu
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate preparation and publication contracts
        run: python3 -B -m unittest discover -v -s .github/campaign/tests
  cuda_compile:
    name: cuda_compile
    needs: [prepare, cpu, cuda_image]
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      CI_CUDA_IMAGE: ${{ needs.cuda_image.outputs.image }}
    steps:
      - name: Free unused hosted toolchains for CUDA images and archives
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-asd-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/campaign
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: compile_cache
        with:
          path: ${{ runner.temp }}/campaign-cache
          key: mistral-sm61-${{ needs.prepare.outputs.environment_key }}-${{ needs.prepare.outputs.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mistral-sm61-${{ needs.prepare.outputs.environment_key }}-${{ needs.prepare.outputs.cache_key }}-
            mistral-sm61-${{ needs.prepare.outputs.environment_key }}-
      - name: Restore an identical verified build bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_BUNDLE: mistral-builds-${{ needs.prepare.outputs.bundle_key }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/builds"
          prior="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$BUILD_BUNDLE&per_page=100" --jq '.artifacts[] | select(.expired==false and .workflow_run.head_branch=="mirror_orch") | .id' | head -n 1)"
          if [[ -n "$prior" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$prior/zip" > "$RUNNER_TEMP/prior-builds.zip"
            unzip -oq "$RUNNER_TEMP/prior-builds.zip" -d "$RUNNER_TEMP/builds"
            valid=true
            while read -r component; do
              python3 "$RUNNER_TEMP/campaign/orchestrator/proof.py" verify "$RUNNER_TEMP/builds/$component" "$component" --plan "$RUNNER_TEMP/campaign/plan.json" || valid=false
            done < <(jq -r '.matrix[].component' "$RUNNER_TEMP/campaign/plan.json")
            if [[ "$valid" == true ]]; then
              echo 'REUSE_BUILD=true' >> "$GITHUB_ENV"
              echo 'Reusing matching executable archives and CPU execution proofs' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Pull the exact verified compiler image
        if: env.REUSE_BUILD != 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$CI_CUDA_IMAGE"
      - name: Verify hosted CPU loader before expensive compilation
        if: env.REUSE_BUILD != 'true'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint python3 \
            -v "$RUNNER_TEMP:$RUNNER_TEMP:ro" "$CI_CUDA_IMAGE" \
            "$RUNNER_TEMP/campaign/orchestrator/cpu-runtime.py" -- \
            python3 -c 'import ctypes; assert ctypes.CDLL("libcuda.so.1").cuInit(0) == 34'
      - name: Compile each independent source and run CPU tests with CUDA enabled
        if: env.REUSE_BUILD != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/campaign/plan.json"
          mkdir -p "$RUNNER_TEMP/builds" "$RUNNER_TEMP/campaign-cache" "$RUNNER_TEMP/campaign-home"
          git fetch "$RUNNER_TEMP/campaign/candidate.bundle" 'refs/heads/integration/campaign/*:refs/remotes/build/*'
          while read -r component sha key; do
            dir="$RUNNER_TEMP/builds/$component"
            mkdir -p "$dir"
            docker run --rm --user "$(id -u):$(id -g)" --security-opt=no-new-privileges --entrypoint /bin/bash \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:rw" -v "$RUNNER_TEMP:$RUNNER_TEMP:rw" \
              -w "$GITHUB_WORKSPACE" -e "HOME=$RUNNER_TEMP/campaign-home" \
              -e "CAMPAIGN_CACHE=$RUNNER_TEMP/campaign-cache" \
              "$CI_CUDA_IMAGE" "$RUNNER_TEMP/campaign/orchestrator/build.sh" "$dir" "$plan" "$component"
          done < <(jq -r '.matrix[] | [.component,.candidate,.build_key] | @tsv' "$plan")
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && env.REUSE_BUILD != 'true' && steps.compile_cache.outputs.cache-primary-key != ''
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/campaign-cache
          key: ${{ steps.compile_cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: mistral-build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/builds/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: mistral-builds-${{ needs.prepare.outputs.bundle_key }}
          path: ${{ runner.temp }}/builds/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
          compression-level: 0
  release_compile:
    # One optimized binary for Extended only. Never build standalone release variants.
    # Qualification-only pushes still use the inexpensive campaign profile.
    name: Extended-Release-R1 single build
    if: github.event_name == 'workflow_dispatch'
    needs: [prepare, cpu, cuda_compile, cuda_image]
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      CI_CUDA_IMAGE: ${{ needs.cuda_image.outputs.image }}
    steps:
      - name: Free unused hosted toolchains for CUDA
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-asd-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/campaign
      - name: Verify release packaging contracts offline
        run: python3 -B -m unittest discover -v -s .github/campaign/tests -p test_release_r1.py
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/campaign-cache
          key: mistral-sm61-${{ needs.prepare.outputs.environment_key }}-${{ needs.prepare.outputs.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mistral-sm61-${{ needs.prepare.outputs.environment_key }}-${{ needs.prepare.outputs.cache_key }}-
            mistral-sm61-${{ needs.prepare.outputs.environment_key }}-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: release_cache
        with:
          path: ${{ runner.temp }}/extended-release-r1
          key: extended-release-r1-${{ needs.prepare.outputs.environment_key }}-${{ needs.prepare.outputs.candidate }}-${{ needs.prepare.outputs.recipe }}
      - name: Verify cached optimized executable provenance
        if: steps.release_cache.outputs.cache-hit == 'true'
        run: |
          python3 .github/campaign/release_r1.py verify \
            --plan "$RUNNER_TEMP/campaign/plan.json" \
            --dir "$RUNNER_TEMP/extended-release-r1"
      - name: Pull immutable compiler only on release cache miss
        if: steps.release_cache.outputs.cache-hit != 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$CI_CUDA_IMAGE"
      - name: Build exact Extended candidate once in optimized release mode
        if: steps.release_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/extended-release-r1" "$RUNNER_TEMP/campaign-cache" "$RUNNER_TEMP/release-home"
          git fetch "$RUNNER_TEMP/campaign/candidate.bundle" 'refs/heads/integration/campaign/*:refs/remotes/release/*'
          docker run --rm --user "$(id -u):$(id -g)" --security-opt=no-new-privileges \
            --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:rw" -v "$RUNNER_TEMP:$RUNNER_TEMP:rw" \
            -w "$GITHUB_WORKSPACE" -e "HOME=$RUNNER_TEMP/release-home" \
            -e "CAMPAIGN_CACHE=$RUNNER_TEMP/campaign-cache" \
            "$CI_CUDA_IMAGE" \
            "$RUNNER_TEMP/campaign/orchestrator/release-r1.sh" \
            "$RUNNER_TEMP/campaign/plan.json" \
            "$RUNNER_TEMP/extended-release-r1" "$GITHUB_WORKSPACE"
      - name: Verify the exact release executable again
        run: |
          python3 "$RUNNER_TEMP/campaign/orchestrator/release_r1.py" verify \
            --plan "$RUNNER_TEMP/campaign/plan.json" \
            --dir "$RUNNER_TEMP/extended-release-r1"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.release_cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/extended-release-r1
          key: extended-release-r1-${{ needs.prepare.outputs.environment_key }}-${{ needs.prepare.outputs.candidate }}-${{ needs.prepare.outputs.recipe }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mistral-extended-release-r1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/extended-release-r1/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  release_image:
    name: Assemble and verify the exact release runtime image
    if: github.event_name == 'workflow_dispatch'
    needs: [prepare, release_compile]
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - name: Free space for the runtime image archive
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-asd-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/campaign
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-extended-release-r1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/extended-release-r1
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: image_cache
        with:
          path: ${{ runner.temp }}/release-image
          key: extended-release-r1-oci-${{ needs.prepare.outputs.environment_key }}-${{ needs.prepare.outputs.candidate }}-${{ needs.prepare.outputs.recipe }}
      - name: Build image without recompiling and check its payload and loader
        if: steps.image_cache.outputs.cache-hit != 'true'
        run: |
          chmod +x "$RUNNER_TEMP/extended-release-r1/mistralrs"
          python3 "$RUNNER_TEMP/campaign/orchestrator/release_image_r1.py" build \
            --plan "$RUNNER_TEMP/campaign/plan.json" --dir "$RUNNER_TEMP/extended-release-r1" \
            --image-dir "$RUNNER_TEMP/release-image"
      - name: Verify the qualified image archive before reuse
        run: |
          chmod +x "$RUNNER_TEMP/extended-release-r1/mistralrs"
          python3 "$RUNNER_TEMP/campaign/orchestrator/release_image_r1.py" verify \
            --plan "$RUNNER_TEMP/campaign/plan.json" --dir "$RUNNER_TEMP/extended-release-r1" \
            --image-dir "$RUNNER_TEMP/release-image"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.image_cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/release-image
          key: extended-release-r1-oci-${{ needs.prepare.outputs.environment_key }}-${{ needs.prepare.outputs.candidate }}-${{ needs.prepare.outputs.recipe }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mistral-extended-oci-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-image/oci.json
            ${{ runner.temp }}/release-image/loader-help.txt
            ${{ runner.temp }}/release-image/loader-ldd.txt
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mistral-extended-oci-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-image/image.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  gpu:
    name: SM61 Mistral Extended runtime (candidate=${{ needs.prepare.outputs.candidate }})
    needs: [prepare, cpu, cuda_compile, release_compile, release_image]
    # A qualification-only push must not wait for a release build.
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.cpu.result == 'success' &&
      needs.cuda_compile.result == 'success' &&
      (needs.release_compile.result == 'success' ||
       (github.event_name == 'push' && needs.release_compile.result == 'skipped')) &&
      (needs.release_image.result == 'success' ||
       (github.event_name == 'push' && needs.release_image.result == 'skipped'))
    env:
      ASD_REQUIRED: "true"
    runs-on: [mistral-extended, "mistral-extended-${{ github.run_id }}"]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-asd-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/campaign
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-builds-${{ needs.prepare.outputs.bundle_key }}
          path: ${{ runner.temp }}/builds
      - name: Verify the pinned Candle physical qualifications before executing downloaded code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/campaign/orchestrator/verify-candle.py" "$RUNNER_TEMP/campaign/plan.json"
      - name: Prepare nextest extraction directories
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r component; do
            mkdir -p "$RUNNER_TEMP/gpu-proof/target-$component"
          done < <(python3 -c 'import json,sys; [print(n["component"]) for n in json.load(open(sys.argv[1]))["matrix"]]' "$RUNNER_TEMP/campaign/plan.json")
          lscpu > "$RUNNER_TEMP/gpu-proof/cpu.txt"
      - name: Execute hosted archives on physical Pascal
        run: bash "$RUNNER_TEMP/campaign/orchestrator/gpu.sh" "$RUNNER_TEMP/campaign/plan.json" "$RUNNER_TEMP/builds" "$RUNNER_TEMP/gpu-proof"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        if: github.event_name == 'workflow_dispatch'
        with:
          name: mistral-extended-release-r1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/extended-release-r1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        if: github.event_name == 'workflow_dispatch'
        with:
          name: mistral-extended-oci-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-image
      - name: Execute Text VL and GGUF with the delivered release binary on CPU and CUDA
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/extended-release-r1/mistralrs"
          python3 "$RUNNER_TEMP/campaign/orchestrator/release_r1.py" gpu \
            --plan "$RUNNER_TEMP/campaign/plan.json" \
            --dir "$RUNNER_TEMP/extended-release-r1" \
            --proofs "$RUNNER_TEMP/gpu-proof" --image-dir "$RUNNER_TEMP/release-image"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mistral-asd-gpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gpu-proof/
            !${{ runner.temp }}/gpu-proof/target-*/**
          if-no-files-found: warn
          retention-days: 30
  promote:
    # Qualification pushes stage evidence; publication requires a deliberate dispatch.
    # A one-shot push qualifies only. Promotion requires a separate
    # deliberate dispatch AND complete real-model evidence from the
    # pinned candidate; never publish source branches from this push.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/mirror_orch' &&
      inputs.qualification_only != true
    needs: [prepare, cpu, cuda_compile, gpu]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-asd-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/campaign
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-builds-${{ needs.prepare.outputs.bundle_key }}
          path: ${{ runner.temp }}/proofs
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-asd-gpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proofs/gpu
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-extended-release-r1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proofs/release-r1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-extended-oci-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proofs/release-image
      - name: Require accepted model evidence for the exact release binary
        run: |
          chmod +x "$RUNNER_TEMP/proofs/release-r1/mistralrs"
          python3 .github/campaign/release_r1.py verify-gpu \
            --plan "$RUNNER_TEMP/campaign/plan.json" --dir "$RUNNER_TEMP/proofs/release-r1" \
            --proofs "$RUNNER_TEMP/proofs/gpu" --image-dir "$RUNNER_TEMP/proofs/release-image"
      - name: Restore the existing source-level model evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch "$RUNNER_TEMP/campaign/candidate.bundle" 'refs/heads/integration/campaign/*:refs/remotes/build/*'
          python3 .github/lfm3/restore.py --repo "$PWD" --plan "$RUNNER_TEMP/campaign/plan.json" --proofs "$RUNNER_TEMP/proofs"
      - name: Publish verified standalones and final branch atomically
        run: |
          git fetch "$RUNNER_TEMP/campaign/candidate.bundle" 'refs/heads/integration/campaign/*:refs/remotes/build/*'
          python3 .github/campaign/campaign.py promote --repo "$PWD" --plan "$RUNNER_TEMP/campaign/plan.json" --proofs "$RUNNER_TEMP/proofs" --run-id "$GITHUB_RUN_ID"

  release_publish:
    # OCI publication requires the normal explicit promotion gate, including
    # physical SM61 validation and complete real-model LFM3 evidence.
    name: Extended-Release-R1 OCI and native archive
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/mirror_orch' &&
      inputs.qualification_only != true
    needs: [prepare, cpu, cuda_compile, release_compile, release_image, gpu, promote]
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-asd-prep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/campaign
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-extended-release-r1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/extended-release-r1
      - name: Verify release digest and candidate identity
        run: |
          chmod +x "$RUNNER_TEMP/extended-release-r1/mistralrs"
          python3 .github/campaign/release_r1.py verify \
            --plan "$RUNNER_TEMP/campaign/plan.json" \
            --dir "$RUNNER_TEMP/extended-release-r1"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-asd-gpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proofs/gpu
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-extended-oci-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-image
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: mistral-extended-oci-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-image
      - name: Recheck release-specific physical and numeric acceptance before publication
        run: |
          python3 .github/campaign/release_r1.py verify-gpu \
            --plan "$RUNNER_TEMP/campaign/plan.json" --dir "$RUNNER_TEMP/extended-release-r1" \
            --proofs "$RUNNER_TEMP/proofs/gpu" --image-dir "$RUNNER_TEMP/release-image"
      - name: Create native Linux archive and proof
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-archive"
          archive="$RUNNER_TEMP/release-archive/mistralrs-extended-sm61-cuda12.9.2-x86_64.tar.zst"
          tar -C "$RUNNER_TEMP/extended-release-r1" -I 'zstd -T2' \
            -cf "$archive" mistralrs release.json
          (
            cd "$RUNNER_TEMP/release-archive"
            sha256sum "${archive##*/}" > "${archive##*/}.sha256"
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mistral-extended-native-r1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-archive/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Publish the already qualified image without rebuilding
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 .github/campaign/release_image_r1.py publish \
            --plan "$RUNNER_TEMP/campaign/plan.json" --dir "$RUNNER_TEMP/extended-release-r1" \
            --image-dir "$RUNNER_TEMP/release-image"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mistral-extended-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-image/published.json
          if-no-files-found: error
          retention-days: 90
